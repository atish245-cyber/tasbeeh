<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d2b1c">

  <meta name="description" content="A beautiful digital Tasbeeh counter with Arabic dhikr, daily duas, English and Bangla meanings, session history, and target tracking.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasbeeh">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="author" content="Shah Kabir">
  <meta name="developer" content="Shah Kabir">
  <meta name="copyright" content="© 2026 Shah Kabir. All rights reserved.">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <title>Tasbeeh — Dhikr Counter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06231a;
      font-family: 'Segoe UI', Roboto, 'Noto Sans Bengali', 'Kalpurush', system-ui, -apple-system, sans-serif;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      margin: 0;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(159, 223, 159, 0.18), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(46, 122, 72, 0.28), transparent 60%),
        linear-gradient(180deg, #0b2a1e 0%, #06231a 100%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.14;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><defs><pattern id='p' x='0' y='0' width='120' height='120' patternUnits='userSpaceOnUse'><g fill='none' stroke='%23bbf0bb' stroke-width='1.1'><path d='M60 10 L75 30 L100 30 L85 50 L95 75 L60 58 L25 75 L35 50 L20 30 L45 30 Z'/><path d='M60 25 L70 38 L88 38 L78 50 L85 68 L60 56 L35 68 L42 50 L32 38 L50 38 Z'/><circle cx='60' cy='48' r='5' fill='%23bbf0bb' opacity='0.6'/><circle cx='60' cy='48' r='10' fill='none' stroke='%23bbf0bb' opacity='0.4'/><path d='M0 0 L15 0 M0 15 L0 0 M120 0 L105 0 M120 15 L120 0 M0 120 L15 120 M0 105 L0 120 M120 120 L105 120 M120 105 L120 120'/></g></pattern></defs><rect width='240' height='240' fill='url(%23p)'/></svg>");
      background-size: 240px 240px;
      background-repeat: repeat;
      pointer-events: none;
    }

    .app-shell {
      background: rgba(13, 43, 28, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 48px;
      padding: 20px 16px 24px;
      box-shadow: 0 30px 55px -20px rgba(0, 0, 0, 0.85), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      width: 100%;
      max-width: 480px;
      height: min(760px, calc(100dvh - 24px));
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .app-card {
      background: rgba(13, 43, 28, 0.95);
      border-radius: 40px;
      padding: 20px 16px 30px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6), 0 10px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid #3b6e4b;
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .app-card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400' preserveAspectRatio='xMidYMid slice'><g fill='none' stroke='%239fdf9f' stroke-width='1.2'><path d='M200 80 Q 130 120 130 200 L 130 320 L 270 320 L 270 200 Q 270 120 200 80 Z'/><path d='M200 100 Q 145 135 145 205 L 145 315 L 255 315 L 255 205 Q 255 135 200 100 Z'/><path d='M200 60 L 200 80 M 200 55 L 210 70 L 200 65 L 190 70 Z' fill='%239fdf9f' opacity='0.7'/><circle cx='200' cy='55' r='4' fill='%239fdf9f' opacity='0.9'/><path d='M40 320 L 40 200 Q 40 170 60 160 M 40 320 L 90 320'/><path d='M360 320 L 360 200 Q 360 170 340 160 M 360 320 L 310 320'/><path d='M120 320 L 120 250 M 280 320 L 280 250'/><line x1='40' y1='340' x2='360' y2='340'/><line x1='30' y1='360' x2='370' y2='360'/><path d='M200 160 L 190 175 L 200 190 L 210 175 Z' fill='%239fdf9f' opacity='0.5'/></g></svg>");
      background-size: cover;
      background-position: center 20%;
      background-repeat: no-repeat;
    }

    .app-card::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(212, 255, 176, 0.12), transparent 70%),
        radial-gradient(ellipse 90% 50% at 50% 100%, rgba(46, 122, 72, 0.18), transparent 70%);
    }

    .app-card > * {
      position: relative;
      z-index: 2;
    }

    .app-content {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      min-height: 26px;
      gap: 4px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .top-bar-left {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .save-indicator {
      font-size: 0.7rem;
      font-weight: 600;
      color: #9fdf9f;
      background: rgba(31, 79, 48, 0.95);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #589b6b;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .save-indicator.show { opacity: 1; }

    .save-indicator .dot {
      width: 6px; height: 6px;
      background: #d4ffb0;
      border-radius: 50%;
      box-shadow: 0 0 6px #d4ffb0;
    }

    .top-btn {
      background: rgba(31, 79, 48, 0.85);
      border: 1px solid #589b6b;
      color: #c6e6b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .top-btn:active { transform: scale(0.95); background: rgba(59, 139, 75, 0.95); }

    .sound-btn {
      background: rgba(31, 79, 48, 0.85);
      border: 1px solid #589b6b;
      color: #c6e6b8;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .sound-btn:active { transform: scale(0.95); }
    .sound-btn.muted {
      background: rgba(94, 58, 30, 0.85);
      border-color: #bb8f5a;
      color: #ffd9a0;
    }

    .dhikr-selector {
      position: relative;
      margin-bottom: 8px;
      z-index: 30;
      flex-shrink: 0;
    }

  .dhikr-select-display {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(18, 51, 31, 0.92);
  border: 1px solid #3f6b4b;
  border-radius: 24px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.15s;
  gap: 8px;
  backdrop-filter: blur(6px);
}

    .dhikr-select-display:active {
      background: rgba(26, 68, 41, 0.95);
      transform: scale(0.99);
    }

    .dhikr-select-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      overflow: hidden;
    }

    .dhikr-selected-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e9f7d6;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.2;
    }

    .dhikr-selected-arabic {
      font-size: 1.05rem;
      color: #9fdf9f;
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade', serif;
      direction: rtl;
      text-align: center;
      max-width: 100%;
      line-height: 1.6;
      padding: 2px 0;
      white-space: normal;
      word-break: break-word;
    }

    .dhikr-selected-translation {
      font-size: 0.7rem;
      color: #c6e6b8;
      text-align: center;
      max-width: 100%;
      line-height: 1.4;
      font-style: italic;
      white-space: normal;
      word-break: break-word;
    }

    .dhikr-selected-translation-bn {
      font-size: 0.72rem;
      color: #9fdf9f;
      text-align: center;
      max-width: 100%;
      line-height: 1.5;
      font-family: 'Noto Sans Bengali', 'Kalpurush', sans-serif;
      white-space: normal;
      word-break: break-word;
    }

    .dhikr-select-arrow {
      color: #9fdf9f;
      font-size: 0.8rem;
      transition: transform 0.2s;
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 6px;
    }

    .dhikr-select-display.open .dhikr-select-arrow {
      transform: rotate(180deg);
    }

    .dhikr-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0f2e1d;
      border: 1px solid #3f6b4b;
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9);
      z-index: 40;
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dhikr-dropdown.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dhikr-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 8px;
    }

    .dhikr-option:hover { background: #1a4429; }
    .dhikr-option:active { background: #22633a; }

    .dhikr-option.active {
      background: #2e7a48;
      box-shadow: inset 0 0 0 1px #8fd49c;
    }

    .dhikr-option-info { flex: 1; min-width: 0; }

    .dhikr-option-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e9f7d6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dhikr-option-arabic {
      font-size: 0.85rem;
      color: #9fdf9f;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade', serif;
      direction: rtl;
      text-align: right;
      line-height: 1.4;
      padding: 1px 0;
    }

    .dhikr-option-translation,
    .dhikr-option-translation-bn {
      display: none;
    }

    .dhikr-option-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .dhikr-option-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: #d4ffb0;
      font-variant-numeric: tabular-nums;
    }

    .dhikr-option-target {
      font-size: 0.65rem;
      color: #7fa588;
    }

    .dhikr-option-delete {
      background: transparent;
      border: none;
      color: #d47a5a;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      opacity: 0.6;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .dhikr-option-delete:hover { opacity: 1; background: rgba(94, 58, 30, 0.5); }

    .dhikr-divider {
      height: 1px;
      background: #2d5a3b;
      margin: 4px 8px;
    }

    .dhikr-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(46, 122, 72, 0.4);
      border: 1px dashed #589b6b;
      color: #9fdf9f;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dhikr-add-btn:hover { background: rgba(46, 122, 72, 0.7); }
    .dhikr-add-btn:active { transform: scale(0.98); }

    /* ============ COUNTER - GRAND MOSQUE DESIGN ============ */
    .count-wrap {
      width: 100%;
      flex: 1;
      min-height: 60px;
      margin: 4px 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      border-radius: 20px;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.4s ease;
      background: #0a1a2a;
      position: relative;
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.85),
        0 4px 12px rgba(0, 0, 0, 0.4);
      border: 1px solid #2a4a35;
    }

    .count-wrap:active {
      transform: scale(0.995);
    }

    .count-wrap.target-reached {
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.85),
        0 0 30px rgba(240, 220, 158, 0.6),
        0 4px 12px rgba(0, 0, 0, 0.4);
      animation: targetGlow 2.2s ease-in-out infinite;
    }

    @keyframes targetGlow {
      0%, 100% {
        box-shadow:
          inset 0 0 40px rgba(0, 0, 0, 0.85),
          0 0 25px rgba(240, 220, 158, 0.5),
          0 4px 12px rgba(0, 0, 0, 0.4);
      }
      50% {
        box-shadow:
          inset 0 0 40px rgba(0, 0, 0, 0.85),
          0 0 45px rgba(240, 220, 158, 0.85),
          0 4px 12px rgba(0, 0, 0, 0.4);
      }
    }

    .mosque-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* ============ COUNTER NUMBER (NO CIRCLE) ============ */
    .counter-number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
    }
    .counter-number-text {
      font-size: 6rem;
      font-weight: 900;
      color: #fff8dc;
      text-shadow:
        0 0 30px rgba(255, 230, 160, 0.95),
        0 0 60px rgba(255, 180, 80, 0.7),
        5px 5px 0 #0a0a0a,
        -4px -4px 0 #0a0a0a,
        4px -4px 0 #0a0a0a,
        -4px 4px 0 #0a0a0a,
        0 0 12px #0a0a0a;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      transition: font-size 0.3s ease;
    }
    .counter-number-text[data-len="3"] { font-size: 5.2rem; }
    .counter-number-text[data-len="4"] { font-size: 4.2rem; }
    .counter-number-text[data-len="5"] { font-size: 3.5rem; }
    .counter-number-text[data-len="6"] { font-size: 2.9rem; }

    /* ============ END COUNTER DESIGN ============ */

    .bottom-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 0;
      padding-bottom: 4px;
    }

    .target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 46, 29, 0.95);
      padding: 6px 12px;
      border-radius: 60px;
      box-shadow: inset 0 2px 6px #00000055, 0 2px 4px #00000033;
      border: 1px solid #2d5a3b;
      gap: 6px;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    .target-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #b6d7b0;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .target-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .target-input {
      width: 130px;
      max-width: 100%;
      padding: 5px 8px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #dcf5c0;
      background: #1f4f30;
      border: 1px solid #6fa87f;
      border-radius: 40px;
      text-align: center;
      outline: none;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 2px 4px #00000033;
      font-variant-numeric: tabular-nums;
      transition: all 0.15s;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }

    .target-input:focus {
      background: #2b6e40;
      border-color: #bbf0bb;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 0 0 3px rgba(187, 240, 187, 0.25);
    }

    .target-input::-webkit-outer-spin-button,
    .target-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .target-input[type=number] { -moz-appearance: textfield; }

    .progress-ring {
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .ring-track {
      width: 100%;
      height: 8px;
      background: #0b1e13;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px #000000aa;
    }

    .ring-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9fdf9f, #d2f0b0);
      border-radius: 20px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 8px #bbf0bb;
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1 1 0;
      min-width: 100px;
      padding: 12px 8px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 60px;
      background: #1f4a2d;
      color: #f0ffe0;
      box-shadow: 0 6px 0 #0b1f11, 0 4px 8px #00000055;
      transition: all 0.06s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #589b6b;
      text-shadow: 0 2px 0 #0b1f11;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0b1f11, 0 4px 8px #00000055;
    }

    .btn-primary {
      background: #2e7a48;
      box-shadow: 0 6px 0 #164a26, 0 4px 8px #00000055;
      border-color: #8fd49c;
      font-size: 1.25rem;
    }

    .btn-secondary { background: #1f4a2d; font-size: 0.95rem; }

    .btn-warning {
      background: #5e3a1e;
      border-color: #bb8f5a;
      box-shadow: 0 6px 0 #33200e, 0 4px 8px #00000055;
      color: #ffe6c7;
      font-size: 0.95rem;
    }

    .btn-icon { font-size: 1.2rem; filter: drop-shadow(0 2px 2px black); }

    .developer-credit-row {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 4px;
      flex-shrink: 0;
      pointer-events: none;
      z-index: 5;
    }

    .developer-credit {
      text-align: center;
      font-size: 0.62rem;
      color: #8fb898;
      letter-spacing: 0.5px;
      opacity: 0.9;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 8px;
    }

    .developer-credit strong {
      color: #bbf0bb;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(159, 223, 159, 0.18), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(46, 122, 72, 0.28), transparent 60%),
        linear-gradient(180deg, #0b2a1e 0%, #06231a 100%);
      display: flex;

        { category: '🌙 Ramadan & Fasting', title: 'Dua for Suhoor (Pre-Dawn Meal)', arabic: 'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ', translit: 'Allahumma barik lana fima razaqtana wa qina \'adhaban-nar', en: 'O Allah, bless us in what You have provided us and save us from the punishment of the Fire.', bn: 'হে আল্লাহ, আপনি আমাদের যা রিজিক দিয়েছেন তাতে বরকত দিন এবং জাহান্নামের আজাব থেকে রক্ষা করুন।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua at Iftar (Breaking the Fast)', arabic: 'ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ', translit: 'Dhahaba adh-dhama\'u wabtallatil-\'uruqu wa thabatal-ajru in sha Allah', en: 'The thirst has gone, the veins are moistened, and the reward is confirmed, if Allah wills.', bn: 'পিপাসা দূর হয়েছে, শিরাগুলো সিক্ত হয়েছে এবং ইনশাআল্লাহ প্রতিদান নিশ্চিত হয়েছে।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua When Seeing the New Moon', arabic: 'اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ وَالسَّلَامَةِ وَالْإِسْلَامِ', translit: 'Allahumma ahillahu \'alayna bil-yumni wal-iman was-salamati wal-islam', en: 'O Allah, let this moon appear on us with security, faith, safety, and Islam.', bn: 'হে আল্লাহ, এই চাঁদ আমাদের উপর নিরাপত্তা, ঈমান, শান্তি ও ইসলামের সাথে উদিত করুন।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua for Laylatul Qadr', arabic: 'اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي', translit: 'Allahumma innaka \'afuwwun tuhibbul-\'afwa fa\'fu \'anni', en: 'O Allah, You are Most Forgiving, and You love forgiveness; so forgive me.', bn: 'হে আল্লাহ, আপনি ক্ষমাশীল, ক্ষমা করতে ভালোবাসেন, তাই আমাকে ক্ষমা করুন।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua for Breaking Fast at Someone\'s Home', arabic: 'أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ وَصَلَّتْ عَلَيْكُمُ الْمَلَائِكَةُ', translit: 'Aftara \'indakumus-sa\'imuna wa akala ta\'amakumul-abraru wa sallat \'alaykumul-mala\'ikah', en: 'May the fasting break their fast in your home, and may the righteous eat your food, and may the angels send blessings upon you.', bn: 'আপনার ঘরে রোজাদাররা ইফতার করুক, নেককাররা আপনার খাবার খাক এবং ফেরেশতারা আপনার উপর দোয়া করুক।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua When Someone Insults You While Fasting', arabic: 'إِنِّي صَائِمٌ إِنِّي صَائِمٌ', translit: 'Inni sa\'imun, inni sa\'imun', en: 'I am fasting, I am fasting.', bn: 'আমি রোজাদার, আমি রোজাদার।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua for Forgiveness in Ramadan', arabic: 'رَبَّنَا اغْفِرْ لَنَا وَلِوَالِدَيْنَا وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا', translit: 'Rabbanaghfir lana wa liwalidayna warhamhuma kama rabbayani saghira', en: 'Our Lord, forgive us and our parents, and have mercy on them as they raised me when I was small.', bn: 'হে আমাদের রব, আমাদের এবং আমাদের পিতা-মাতাকে ক্ষমা করুন এবং তাদের প্রতি দয়া করুন যেমন তারা আমাকে ছোটবেলায় লালন-পালন করেছেন।' },

        { category: '😴 Sleep & Waking', title: 'Before Sleeping', arabic: 'بِاسْمِكَ ٱللَّٰهُمَّ أَمُوتُ وَأَحْيَا', translit: 'Bismika Allahumma amootu wa ahya', en: 'In Your name, O Allah, I die and I live.', bn: 'হে আল্লাহ, আপনার নামেই আমি মরি ও বাঁচি।' },
        { category: '😴 Sleep & Waking', title: 'Upon Waking Up', arabic: 'ٱلْحَمْدُ لِلَّٰهِ ٱلَّذِى أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ ٱلنُّشُورُ', translit: 'Alhamdulillahi alladhi ahyana ba\'da ma amatana wa ilayhin-nushur', en: 'All praise is for Allah who gave us life after death, and to Him is the resurrection.', bn: 'সকল প্রশংসা আল্লাহর, যিনি মৃত্যুর পর আমাদের জীবন দান করেছেন এবং তাঁর কাছেই ফিরে যেতে হবে।' },
        {
          category: '😴 Sleep & Waking',
          title: 'Ayatul Kursi (Full)',
          arabic: 'ٱللَّٰهُ لَا إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ',
          translit: 'Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta\'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa\'u \'indahu illa bi-idhnih. Ya\'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay\'in min \'ilmihi illa bima sha\'. Wasi\'a kursiyyuhus-samawati wal-ard. Wa la ya\'uduhu hifzuhuma. Wa Huwal-\'Aliyyul-\'Azim.',
          en: 'Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is before them and what will be after them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great.',
          bn: 'আল্লাহ, তিনি ছাড়া কোনো উপাস্য নেই। তিনি চিরঞ্জীব, সবকিছুর ধারক। তাঁকে তন্দ্রা ও নিদ্রা স্পর্শ করে না। আসমান ও জমিনে যা কিছু আছে সবই তাঁর। কে আছে যে তাঁর অনুমতি ছাড়া তাঁর কাছে সুপারিশ করবে? তিনি জানেন তাদের সামনে ও পিছনে যা কিছু আছে। তারা তাঁর জ্ঞানের কিছুই আয়ত্ত করতে পারে না, তবে তিনি যতটুকু চান। তাঁর কুরসি আসমান ও জমিন পরিব্যাপ্ত করে আছে, আর তা রক্ষণাবেক্ষণ তাঁর জন্য কষ্টকর নয়। তিনিই সুউচ্চ, মহান।'
        },

        { category: '🍽️ Eating & Drinking', title: 'Before Eating', arabic: 'بِسْمِ ٱللَّٰهِ وَعَلَىٰ بَرَكَةِ ٱللَّٰهِ', translit: 'Bismillahi wa \'ala barakatillah', en: 'In the name of Allah and with the blessings of Allah.', bn: 'আল্লাহর নামে এবং আল্লাহর বরকতের সাথে।' },
        { category: '🍽️ Eating & Drinking', title: 'After Eating', arabic: 'ٱلْحَمْدُ لِلَّٰهِ ٱلَّذِى أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ', translit: 'Alhamdulillahi alladhi at\'amana wa saqana wa ja\'alana muslimin', en: 'All praise is for Allah who fed us, gave us drink, and made us Muslims.', bn: 'সকল প্রশংসা আল্লাহর, যিনি আমাদের খাওয়ালেন, পান করালেন এবং মুসলিম বানালেন।' },
        { category: '🍽️ Eating & Drinking', title: 'When Forgetting Bismillah', arabic: 'بِسْمِ ٱللَّٰهِ أَوَّلَهُ وَآخِرَهُ', translit: 'Bismillahi awwalahu wa akhirahu', en: 'In the name of Allah at the beginning and at the end.', bn: 'আল্লাহর নামে শুরুতে এবং শেষে।' },

        { category: '🚿 Bathroom', title: 'Before Entering Toilet', arabic: 'ٱللَّٰهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ ٱلْخُبُثِ وَٱلْخَبَائِثِ', translit: 'Allahumma inni a\'udhu bika minal-khubuthi wal-khaba\'ith', en: 'O Allah, I seek refuge with You from the male and female devils.', bn: 'হে আল্লাহ, আমি পুরুষ ও নারী শয়তান থেকে আপনার আশ্রয় চাই।' },
        { category: '🚿 Bathroom', title: 'After Leaving Toilet', arabic: 'غُفْرَانَكَ', translit: 'Ghufranak', en: 'I seek Your forgiveness.', bn: 'আমি আপনার ক্ষমা প্রার্থনা করি।' },

        { category: '🕌 Wudu & Prayer', title: 'Before Wudu', arabic: 'بِسْمِ ٱللَّٰهِ', translit: 'Bismillah', en: 'In the name of Allah.', bn: 'আল্লাহর নামে।' },
        { category: '🕌 Wudu & Prayer', title: 'After Wudu', arabic: 'أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا ٱللَّٰهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ', translit: 'Ash-hadu an la ilaha illallah wa ash-hadu anna Muhammadan \'abduhu wa rasuluh', en: 'I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and messenger.', bn: 'আমি সাক্ষ্য দিচ্ছি যে, আল্লাহ ছাড়া কোনো উপাস্য নেই এবং মুহাম্মদ (সা.) তাঁর বান্দা ও রাসূল।' },
        { category: '🕌 Wudu & Prayer', title: 'Entering the Mosque', arabic: 'ٱللَّٰهُمَّ ٱفْتَحْ لِى أَبْوَابَ رَحْمَتِكَ', translit: 'Allahumma iftah li abwaba rahmatik', en: 'O Allah, open the gates of Your mercy for me.', bn: 'হে আল্লাহ, আমার জন্য আপনার রহমতের দরজা খুলে দিন।' },
        { category: '🕌 Wudu & Prayer', title: 'Leaving the Mosque', arabic: 'ٱللَّٰهُمَّ إِنِّى أَسْأَلُكَ مِنْ فَضْلِكَ', translit: 'Allahumma inni as\'aluka min fadlik', en: 'O Allah, I ask You from Your bounty.', bn: 'হে আল্লাহ, আমি আপনার অনুগ্রহ প্রার্থনা করি।' },

        { category: '🏠 Home & Travel', title: 'Entering Home', arabic: 'بِسْمِ ٱللَّٰهِ وَلَجْنَا وَبِسْمِ ٱللَّٰهِ خَرَجْنَا وَعَلَىٰ رَبِّنَا تَوَكَّلْنَا', translit: 'Bismillahi walajna wa bismillahi kharajna wa \'ala Rabbina tawakkalna', en: 'In the name of Allah we enter, in the name of Allah we leave, and upon our Lord we rely.', bn: 'আল্লাহর নামে আমরা প্রবেশ করলাম, আল্লাহর নামেই বের হলাম এবং আমাদের রবের উপরই ভরসা করলাম।' },
        { category: '🏠 Home & Travel', title: 'Leaving Home', arabic: 'بِسْمِ ٱللَّٰهِ تَوَكَّلْتُ عَلَى ٱللَّٰهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّٰهِ', translit: 'Bismillahi tawakkaltu \'alallah, wa la hawla wa la quwwata illa billah', en: 'In the name of Allah, I place my trust in Allah. There is no might nor power except with Allah.', bn: 'আল্লাহর নামে, আল্লাহর উপরই ভরসা করলাম। আল্লাহর সাহায্য ছাড়া কোনো শক্তি ও ক্ষমতা নেই।' },
        { category: '🏠 Home & Travel', title: 'Travel Dua', arabic: 'سُبْحَٰنَ ٱلَّذِى سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُۥ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ', translit: 'Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun', en: 'Glory to Him who has subjected this to us, and to our Lord we shall surely return.', bn: 'পবিত্র সেই সত্তা, যিনি এটিকে আমাদের অধীন করে দিয়েছেন, নিশ্চয়ই আমরা আমাদের রবের কাছে ফিরে যাব।' },

        { category: '🛡️ Distress & Protection', title: 'When in Difficulty', arabic: 'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ ٱلْعَظِيمُ ٱلْحَلِيمُ', translit: 'La ilaha illallahul-\'Azimul-Halim', en: 'There is no god but Allah, the Mighty, the Forbearing.', bn: 'আল্লাহ ছাড়া কোনো উপাস্য নেই, তিনি মহান ও সহনশীল।' },
        { category: '🛡️ Distress & Protection', title: 'For Anxiety & Sorrow', arabic: 'ٱللَّٰهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ ٱلْهَمِّ وَٱلْحَزَنِ', translit: 'Allahumma inni a\'udhu bika minal-hammi wal-hazan', en: 'O Allah, I seek refuge with You from anxiety and sorrow.', bn: 'হে আল্লাহ, আমি দুশ্চিন্তা ও দুঃখ থেকে আপনার আশ্রয় চাই।' },
        { category: '🛡️ Distress & Protection', title: 'Seeking Forgiveness', arabic: 'أَسْتَغْفِرُ ٱللَّٰهَ رَبِّى مِنْ كُلِّ ذَنْبٍ وَأَتُوبُ إِلَيْهِ', translit: 'Astaghfirullaha Rabbi min kulli dhanbin wa atubu ilayh', en: 'I seek forgiveness from Allah, my Lord, for every sin, and I turn to Him in repentance.', bn: 'আমি আমার রব আল্লাহর কাছে সব গুনাহের জন্য ক্ষমা চাই এবং তাঁর কাছে তওবা করছি।' },

        { category: '💰 Wealth & Provision', title: 'Sufficient with Halal (Kifayat)', arabic: 'اَللَّهُمَّ اكْفِنِيْ بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِيْ بِفَضْلِكَ عَمَّنْ سِوَاكَ', translit: 'Allahumma-kfini bi halalika \'an haramika wa aghnini bi fadlika \'amman siwak', en: 'O Allah, suffice me with what You have made lawful, so I do not need what You have made unlawful, and make me independent of all others besides You by Your grace.', bn: 'হে আল্লাহ, আপনার হালাল দ্বারা আমাকে যথেষ্ট করুন, যাতে হারামের প্রয়োজন না হয়; এবং আপনার অনুগ্রহে আমাকে অন্য সবার থেকে স্বাধীন করুন।' },
        { category: '💰 Wealth & Provision', title: 'Beneficial Knowledge & Good Provision', arabic: 'اَللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا ، وَرِزْقًا طَيِّبًا ، وَعَمَلًا مُتَقَبَّلًا', translit: 'Allahumma inni as\'aluka \'ilman nafi\'an, wa rizqan tayyiban, wa \'amalan mutaqabbalan', en: 'O Allah, I ask You for beneficial knowledge, goodly provision and acceptable deeds.', bn: 'হে আল্লাহ, আমি আপনার কাছে উপকারী জ্ঞান, পবিত্র রিযিক এবং গ্রহণযোগ্য আমল প্রার্থনা করি।' },
        { category: '💰 Wealth & Provision', title: 'Best Provision (Khayr ar-Rizq)', arabic: 'اَللَّهُمَّ ارْزُقْنِيْ رِزْقًا حَلَالًا طَيِّبًا وَأَغْنِنِيْ عَنْ حَرَامِكَ', translit: 'Allahumma-rzuqni rizqan halalan tayyiban wa aghnini \'an haramik', en: 'O Allah, provide me with lawful and good provision, and make me independent of what You have made unlawful.', bn: 'হে আল্লাহ, আমাকে হালাল ও পবিত্র রিযিক দান করুন এবং হারাম থেকে স্বাধীন করুন।' },
        { category: '💰 Wealth & Provision', title: 'Dua of Musa (a.s.) for Provision', arabic: 'رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ', translit: 'Rabbi inni lima anzalta ilayya min khayrin faqir', en: 'My Lord, indeed I am, for whatever good You would send down to me, in need.', bn: 'হে আমার রব, আপনি আমার প্রতি যে কল্যাণ নাযিল করবেন, নিশ্চয়ই আমি তার মুখাপেক্ষী।' },
        { category: '💰 Wealth & Provision', title: 'Increase in Rizq through Shukr', arabic: 'اَللَّهُمَّ أَعِنِّيْ عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ', translit: 'Allahumma a\'inni \'ala dhikrika wa shukrika wa husni \'ibadatik', en: 'O Allah, help me to remember You, to thank You, and to worship You in the best manner.', bn: 'হে আল্লাহ, আপনার স্মরণ, আপনার শোকর এবং আপনার উত্তম ইবাদতের জন্য আমাকে সাহায্য করুন।' },
        { category: '💰 Wealth & Provision', title: 'Dua for Barakah in Wealth', arabic: 'اَللَّهُمَّ بَارِكْ لَنَا فِيْ أَمْوَالِنَا وَأَوْلَادِنَا وَاجْعَلْنَا مِنَ الشَّاكِرِيْنَ', translit: 'Allahumma barik lana fi amwalina wa awladina waj\'alna minash-shakirin', en: 'O Allah, bless us in our wealth and our children, and make us among the grateful.', bn: 'হে আল্লাহ, আমাদের সম্পদ ও সন্তান-সন্ততিতে বরকত দিন এবং আমাদের কৃতজ্ঞদের অন্তর্ভুক্ত করুন।' },

        { category: '✨ Praise & Gratitude', title: 'When Something Good Happens', arabic: 'ٱلْحَمْدُ لِلَّٰهِ ٱلَّذِى بِنِعْمَتِهِ تَتِمُّ ٱلصَّالِحَاتُ', translit: 'Alhamdulillahi alladhi bi ni\'matihi tatimmus-salihat', en: 'All praise is for Allah by whose favor good things are accomplished.', bn: 'সকল প্রশংসা আল্লাহর, যাঁর নিয়ামতে সকল কল্যাণ সম্পন্ন হয়।' },
        { category: '✨ Praise & Gratitude', title: 'When Something Bad Happens', arabic: 'ٱلْحَمْدُ لِلَّٰهِ عَلَىٰ كُلِّ حَالٍ', translit: 'Alhamdulillahi \'ala kulli hal', en: 'All praise is for Allah in every situation.', bn: 'সব অবস্থায় আল্লাহর প্রশংসা।' },

        { category: '🌧️ Weather & Nature', title: 'When It Rains', arabic: 'ٱللَّٰهُمَّ صَيِّبًا نَافِعًا', translit: 'Allahumma sayyiban nafi\'a', en: 'O Allah, make it a beneficial rain.', bn: 'হে আল্লাহ, এটি উপকারী বৃষ্টি করুন।' },
        { category: '🌧️ Weather & Nature', title: 'When Hearing Thunder', arabic: 'سُبْحَٰنَ ٱلَّذِى يُسَبِّحُ ٱلرَّعْدُ بِحَمْدِهِ وَٱلْمَلَٰئِكَةُ مِنْ خِيفَتِهِ', translit: 'Subhanal-ladhi yusabbihur-ra\'du bi hamdihi wal-mala\'ikatu min khifatih', en: 'Glory to Him whom the thunder glorifies with His praise, and the angels too out of awe of Him.', bn: 'পবিত্র সেই সত্তা, যাঁর প্রশংসায় বজ্রধ্বনি ও ফেরেশতারা তাঁর ভয়ে তাসবীহ পাঠ করে।' },

        { category: '📚 Knowledge', title: 'For Increase in Knowledge', arabic: 'رَبِّ زِدْنِي عِلْمًا', translit: 'Rabbi zidni \'ilma', en: 'My Lord, increase me in knowledge.', bn: 'হে আমার প্রভু, আমার জ্ঞান বাড়িয়ে দিন।' },
        { category: '📚 Knowledge', title: 'Before Studying', arabic: 'ٱللَّٰهُمَّ ٱنْفَعْنِى بِمَا عَلَّمْتَنِى وَعَلِّمْنِى مَا يَنْفَعُنِى', translit: 'Allahumma infa\'ni bima \'allamtani wa \'allimni ma yanfa\'uni', en: 'O Allah, benefit me with what You have taught me, and teach me what will benefit me.', bn: 'হে আল্লাহ, আপনি আমাকে যা শিখিয়েছেন তা দিয়ে উপকৃত করুন, এবং যা উপকারী তা শিখিয়ে দিন।' },

        { category: '🌟 General', title: 'Sayyidul Istighfar', arabic: 'ٱللَّٰهُمَّ أَنْتَ رَبِّى لَا إِلَٰهَ إِلَّا أَنْتَ خَلَقْتَنِى وَأَنَا عَبْدُكَ', translit: 'Allahumma anta Rabbi la ilaha illa Anta, khalaqtani wa ana \'abduk', en: 'O Allah, You are my Lord, there is no god but You. You created me and I am Your servant.', bn: 'হে আল্লাহ, আপনি আমার রব, আপনি ছাড়া কোনো উপাস্য নেই। আপনি আমাকে সৃষ্টি করেছেন এবং আমি আপনার বান্দা।' },
        { category: '🌟 General', title: 'Best Dhikr', arabic: 'سُبْحَانَ ٱللَّٰهِ وَبِحَمْدِهِ سُبْحَانَ ٱللَّٰهِ ٱلْعَظِيمِ', translit: 'Subhanallahi wa bi hamdihi, Subhanallahil-\'Azim', en: 'Glory be to Allah and praise Him, glory be to Allah the Magnificent.', bn: 'আল্লাহর প্রশংসাসহ পবিত্রতা, মহান আল্লাহ পবিত্র।' }
      ];

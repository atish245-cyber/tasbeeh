  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d2b1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasbeeh">
  <title>Tasbeeh — Dhikr Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b2a1e 0%, #1a4a2e 100%);
      font-family: 'Segoe UI', Roboto, 'Noto Sans Bengali', 'Kalpurush', system-ui, -apple-system, sans-serif;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      margin: 0;
    }

    .tasbeeh-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 20px 16px 24px;
      box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 480px;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .counter-card {
      background: #0d2b1c;
      border-radius: 40px;
      padding: 20px 16px 22px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6), 0 10px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid #3b6e4b;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---------- TOP BAR ---------- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      min-height: 26px;
      gap: 6px;
    }

    .save-indicator {
      font-size: 0.7rem;
      font-weight: 600;
      color: #9fdf9f;
      background: rgba(31, 79, 48, 0.9);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #589b6b;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .save-indicator.show { opacity: 1; }

    .save-indicator .dot {
      width: 6px;
      height: 6px;
      background: #d4ffb0;
      border-radius: 50%;
      box-shadow: 0 0 6px #d4ffb0;
    }

    .top-btn {
      background: rgba(31, 79, 48, 0.6);
      border: 1px solid #589b6b;
      color: #c6e6b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .top-btn:active { transform: scale(0.95); background: rgba(59, 139, 75, 0.8); }

    /* ---------- DHIKR SELECTOR ---------- */
    .dhikr-selector {
      position: relative;
      margin-bottom: 8px;
    }

    .dhikr-select-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #12331f;
      border: 1px solid #3f6b4b;
      border-radius: 24px;
      padding: 10px 16px;
      cursor: pointer;
      transition: all 0.15s;
      gap: 8px;
      min-height: 62px;
    }

    .dhikr-select-display:active {
      background: #1a4429;
      transform: scale(0.99);
    }

    .dhikr-select-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .dhikr-selected-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: #e9f7d6;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.2;
    }

    .dhikr-selected-arabic {
      font-size: 1.1rem;
      color: #9fdf9f;
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade', serif;
      direction: rtl;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.3;
      min-height: 1.3em;
    }

    .dhikr-select-arrow {
      color: #9fdf9f;
      font-size: 0.8rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .dhikr-select-display.open .dhikr-select-arrow {
      transform: rotate(180deg);
    }

    /* ---------- DHIKR DROPDOWN ---------- */
    .dhikr-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0f2e1d;
      border: 1px solid #3f6b4b;
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9);
      z-index: 20;
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dhikr-dropdown.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dhikr-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-option:hover { background: #1a4429; }
    .dhikr-option:active { background: #22633a; }

    .dhikr-option.active {
      background: #2e7a48;
      box-shadow: inset 0 0 0 1px #8fd49c;
    }

    .dhikr-option-info {
      flex: 1;
      min-width: 0;
    }

    .dhikr-option-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e9f7d6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dhikr-option-arabic {
      font-size: 0.78rem;
      color: #8fb898;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade', serif;
      direction: rtl;
      text-align: right;
    }

    .dhikr-option-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .dhikr-option-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: #d4ffb0;
      font-variant-numeric: tabular-nums;
    }

    .dhikr-option-target {
      font-size: 0.65rem;
      color: #7fa588;
    }

    .dhikr-option-delete {
      background: transparent;
      border: none;
      color: #d47a5a;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      opacity: 0.6;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-option-delete:hover { opacity: 1; background: rgba(94, 58, 30, 0.5); }

    .dhikr-divider {
      height: 1px;
      background: #2d5a3b;
      margin: 4px 8px;
    }

    .dhikr-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(46, 122, 72, 0.4);
      border: 1px dashed #589b6b;
      color: #9fdf9f;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-add-btn:hover { background: rgba(46, 122, 72, 0.7); }
    .dhikr-add-btn:active { transform: scale(0.98); }

    /* ---------- COUNT CONTAINER ---------- */
    .count-wrap {
      width: 100%;
      height: 180px;
      padding: 4px 12px;
      margin: 8px 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      border-radius: 20px;
      transition: background 0.15s ease, transform 0.1s ease,
                  box-shadow 0.4s ease;
      -webkit-tap-highlight-color: transparent;
      background: rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .count-wrap:active {
      background: rgba(159, 223, 159, 0.12);
      transform: scale(0.99);
    }

    .count-wrap.target-reached {
      background: rgba(46, 122, 72, 0.15);
      box-shadow: 0 0 24px rgba(159, 223, 159, 0.4),
                  inset 0 0 20px rgba(159, 223, 159, 0.15);
      animation: targetGlow 2.2s ease-in-out infinite;
    }

    @keyframes targetGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(159, 223, 159, 0.35),
                    inset 0 0 18px rgba(159, 223, 159, 0.12);
      }
      50% {
        box-shadow: 0 0 34px rgba(159, 223, 159, 0.6),
                    inset 0 0 24px rgba(159, 223, 159, 0.22);
      }
    }

    /* ---------- COUNT DISPLAY ---------- */
    .count-display {
      font-size: clamp(6rem, 26vw, 11rem);
      font-weight: 900;
      text-align: center;
      color: #e9f7d6;
      text-shadow: 0 0 26px #a3e0a0, 0 14px 0 #0a1f12;
      letter-spacing: 1px;
      line-height: 1;
      word-break: keep-all;
      transition: font-size 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.1s ease,
                  color 0.4s ease;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      display: inline-block;
      max-width: 100%;
      pointer-events: none;
    }

    .count-display.pulse {
      transform: scale(1.05);
      text-shadow: 0 0 45px #d4ffb0, 0 14px 0 #0a1f12;
    }

    .count-display.target-reached {
      color: #f4ffd4;
      text-shadow: 0 0 30px #d4ffb0, 0 14px 0 #0a1f12;
    }

    .count-display[data-len="3"] { font-size: clamp(4.8rem, 20vw, 9rem); }
    .count-display[data-len="4"] { font-size: clamp(3.6rem, 15vw, 7rem); }
    .count-display[data-len="5"] { font-size: clamp(2.8rem, 12vw, 5.6rem); }
    .count-display[data-len="6"] { font-size: clamp(2.3rem, 10vw, 4.6rem); }

    /* ---------- TARGET ROW ---------- */
    .target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f2e1d;
      padding: 8px 12px;
      border-radius: 60px;
      margin: 8px 0 16px;
      box-shadow: inset 0 2px 6px #00000055, 0 2px 4px #00000033;
      border: 1px solid #2d5a3b;
      gap: 6px;
    }

    .target-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #b6d7b0;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .target-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .target-input {
      width: 150px;
      max-width: 100%;
      padding: 6px 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #dcf5c0;
      background: #1f4f30;
      border: 1px solid #6fa87f;
      border-radius: 40px;
      text-align: center;
      outline: none;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 2px 4px #00000033;
      font-variant-numeric: tabular-nums;
      transition: all 0.15s;
      -webkit-appearance: none;
      -moz-appearance: textfield;
      letter-spacing: 0.5px;
    }

    .target-input:focus {
      background: #2b6e40;
      border-color: #bbf0bb;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 0 0 3px rgba(187, 240, 187, 0.25);
    }

    .target-input::-webkit-outer-spin-button,
    .target-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .target-input[type=number] { -moz-appearance: textfield; }

    /* ---------- PROGRESS ---------- */
    .progress-ring {
      display: flex;
      justify-content: center;
      margin: 6px 0 14px;
    }

    .ring-track {
      width: 100%;
      height: 10px;
      background: #0b1e13;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px #000000aa;
    }

    .ring-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9fdf9f, #d2f0b0);
      border-radius: 20px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 8px #bbf0bb;
    }

    /* ---------- BUTTONS ---------- */
    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 6px;
    }

    .btn {
      flex: 1 1 0;
      min-width: 100px;
      padding: 18px 8px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 60px;
      background: #1f4a2d;
      color: #f0ffe0;
      box-shadow: 0 8px 0 #0b1f11, 0 6px 12px #00000055;
      transition: all 0.06s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #589b6b;
      text-shadow: 0 2px 0 #0b1f11;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #0b1f11, 0 6px 12px #00000055;
    }

    .btn-primary {
      background: #2e7a48;
      box-shadow: 0 8px 0 #164a26, 0 6px 12px #00000055;
      border-color: #8fd49c;
      font-size: 1.5rem;
    }

    .btn-secondary { background: #1f4a2d; font-size: 1.05rem; }

    .btn-warning {
      background: #5e3a1e;
      border-color: #bb8f5a;
      box-shadow: 0 8px 0 #33200e, 0 6px 12px #00000055;
      color: #ffe6c7;
      font-size: 1.05rem;
    }

    .btn-icon { font-size: 1.4rem; filter: drop-shadow(0 2px 2px black); }

    /* ---------- FOOTER ---------- */
    .footer-row {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
      padding: 0 4px;
    }

    .dhikr-translation {
      font-weight: 500;
      color: #c6e6b8;
      background: #12331f;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      border: 1px solid #3f6b4b;
      max-width: 100%;
      text-align: center;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .dhikr-translation .en {
      color: #c6e6b8;
      font-weight: 500;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dhikr-translation .bn {
      color: #9fdf9f;
      font-weight: 500;
      font-size: 0.82rem;
      font-family: 'Noto Sans Bengali', 'Kalpurush', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- CONGRATULATIONS OVERLAY ---------- */
    .congrats-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      padding: 20px;
      overflow: hidden;
    }

    .congrats-overlay.show {
      opacity: 1;
    }

    /* === Floating hearts layer === */
    .heart-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 160;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 2rem;
      line-height: 1;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 8px rgba(255, 120, 180, 0.9));
      user-select: none;
      pointer-events: none;
    }

    /* Different colors/sizes for variety */
    .floating-heart.h-pink { color: #ff8fc7; }
    .floating-heart.h-red { color: #ff5a7a; }
    .floating-heart.h-peach { color: #ffb3c1; }
    .floating-heart.h-lav { color: #e0b0ff; }

    /* Individual heart animations — floating and blowing around */
    @keyframes floatHeart1 {
      0%   { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(40px, -220px) scale(1.1) rotate(20deg); opacity: 1; }
      100% { transform: translate(-30px, -520px) scale(0.7) rotate(-25deg); opacity: 0; }
    }
    @keyframes floatHeart2 {
      0%   { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(-60px, -260px) scale(1.2) rotate(-30deg); opacity: 1; }
      100% { transform: translate(50px, -560px) scale(0.6) rotate(35deg); opacity: 0; }
    }
    @keyframes floatHeart3 {
      0%   { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(80px, -180px) scale(1) rotate(15deg); opacity: 1; }
      100% { transform: translate(-70px, -500px) scale(0.5) rotate(-40deg); opacity: 0; }
    }
    @keyframes floatHeart4 {
      0%   { transform: translate(0, 0) scale(0.35) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(-90px, -300px) scale(1.15) rotate(25deg); opacity: 1; }
      100% { transform: translate(60px, -600px) scale(0.65) rotate(-20deg); opacity: 0; }
    }
    @keyframes floatHeart5 {
      0%   { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(120px, -200px) scale(1.05) rotate(-18deg); opacity: 1; }
      100% { transform: translate(-100px, -540px) scale(0.55) rotate(45deg); opacity: 0; }
    }

    .congrats-card {
      background: linear-gradient(145deg, #2e7a48 0%, #1a4a2e 100%);
      border: 2px solid #ffb3c1;
      border-radius: 32px;
      padding: 32px 28px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7),
                  0 0 60px rgba(255, 143, 199, 0.6),
                  inset 0 0 40px rgba(255, 143, 199, 0.15);
      transform: scale(0.7);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 2;
    }

    .congrats-overlay.show .congrats-card {
      transform: scale(1);
    }

    .congrats-emoji {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 10px;
      animation: bounceEmoji 1.1s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 143, 199, 0.9));
    }

    @keyframes bounceEmoji {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.08); }
    }

    .congrats-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5),
                   0 0 30px rgba(255, 180, 210, 0.9);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .congrats-subtitle {
      font-size: 1.05rem;
      color: #ffe6f0;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .congrats-detail {
      font-size: 0.9rem;
      color: #ffffff;
      font-weight: 500;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }

    .congrats-detail strong {
      color: #ffb3c1;
      font-weight: 800;
    }

    /* ---------- MODALS ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    .modal {
      background: #0d2b1c;
      border: 1px solid #3b6e4b;
      border-radius: 32px;
      padding: 22px 20px;
      width: 100%;
      max-width: 380px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.show .modal { transform: translateY(0); }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #dcf5c0;
      letter-spacing: 0.5px;
    }

    .modal-close {
      background: transparent;
      border: 1px solid #589b6b;
      color: #c6e6b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .modal-close:active { background: #2b6e40; }

    .modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      min-height: 0;
    }

    .history-hint {
      font-size: 0.72rem;
      color: #7fa588;
      text-align: center;
      padding: 4px 8px 8px;
      font-style: italic;
      border-bottom: 1px dashed #2d5a3b;
      margin-bottom: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12331f;
      border: 1px solid #2d5a3b;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #c6e6b8;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .history-item:hover {
      background: #1a4429;
      border-color: #589b6b;
    }

    .history-item:active {
      transform: scale(0.98);
      background: #22633a;
    }

    .history-item .h-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      gap: 2px;
    }

    .history-item .h-name {
      font-weight: 600;
      color: #e9f7d6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item .h-time {
      font-size: 0.65rem;
      color: #7fa588;
      white-space: nowrap;
    }

    .history-item .h-count {
      font-weight: 700;
      color: #9fdf9f;
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      padding: 4px 10px;
      background: #0b1e13;
      border-radius: 20px;
      border: 1px solid #2d5a3b;
      flex-shrink: 0;
    }

    .empty-history {
      text-align: center;
      color: #7fa588;
      padding: 30px 10px;
      font-style: italic;
      font-size: 0.9rem;
    }

    .modal-footer {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #589b6b;
      background: #1f4a2d;
      color: #f0ffe0;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.1s;
      font-family: inherit;
    }

    .modal-btn:active { transform: scale(0.97); }

    .modal-btn.primary { background: #2e7a48; border-color: #8fd49c; }

    .modal-btn.danger {
      background: #5e3a1e;
      border-color: #bb8f5a;
      color: #ffe6c7;
    }

    /* ---------- FORM ---------- */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #b6d7b0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.92rem;
      color: #e9f7d6;
      background: #12331f;
      border: 1px solid #3f6b4b;
      border-radius: 14px;
      outline: none;
      transition: all 0.15s;
      font-family: inherit;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: #8fd49c;
      box-shadow: 0 0 0 3px rgba(143, 212, 156, 0.2);
    }

    .form-textarea {
      resize: none;
      min-height: 60px;
      direction: rtl;
      text-align: right;
      font-size: 1.3rem;
      line-height: 1.6;
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade', serif;
    }

    /* Scrollbar */
    .modal-body::-webkit-scrollbar,
    .dhikr-dropdown::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track,
    .dhikr-dropdown::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb,
    .dhikr-dropdown::-webkit-scrollbar-thumb { background: #2d5a3b; border-radius: 3px; }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #2e7a48;
      color: #f0ffe0;
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #8fd49c;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 200;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 420px) {
      .tasbeeh-container { padding: 14px 10px 18px; border-radius: 36px; }
      .counter-card { padding: 16px 12px 20px; }
      .btn { padding: 15px 6px; font-size: 1.05rem; min-width: 85px; }
      .btn-primary { font-size: 1.3rem; }
      .target-label { font-size: 0.8rem; }
      .target-input { width: 120px; font-size: 1.05rem; padding: 6px 8px; }
      .dhikr-selected-text { font-size: 0.85rem; }
      .dhikr-selected-arabic { font-size: 1rem; }
      .dhikr-translation { font-size: 0.75rem; padding: 6px 12px; }
      .dhikr-translation .en,
      .dhikr-translation .bn { font-size: 0.75rem; }
      .count-wrap { height: 150px; }
      .congrats-card { padding: 26px 20px; }
      .congrats-emoji { font-size: 3.5rem; }
      .congrats-title { font-size: 1.9rem; }
      .congrats-subtitle { font-size: 0.95rem; }
      .congrats-detail { font-size: 0.8rem; }
      .floating-heart { font-size: 1.7rem; }
    }

    @media (max-width: 340px) {
      .target-input { width: 105px; font-size: 0.95rem; }
      .target-label { font-size: 0.72rem; }
      .dhikr-selected-text { font-size: 0.78rem; }
      .dhikr-selected-arabic { font-size: 0.92rem; }
      .dhikr-translation .en,
      .dhikr-translation .bn { font-size: 0.7rem; }
      .count-wrap { height: 130px; }
    }

    @media (max-height: 700px) {
      .count-wrap { height: 140px; margin: 4px 0 10px; }
      .target-row { margin: 6px 0 12px; padding: 6px 12px; }
      .progress-ring { margin: 4px 0 10px; }
      .button-grid { margin: 10px 0 4px; }
      .btn { padding: 14px 6px; }
      .footer-row { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="tasbeeh-container">
    <div class="counter-card">
      <!-- Top bar -->
      <div class="top-bar">
        <button id="historyBtn" class="top-btn" title="View session history">📜 History</button>
        <div id="saveIndicator" class="save-indicator">
          <span class="dot"></span> SAVED
        </div>
      </div>

      <!-- Dhikr Selector -->
      <div class="dhikr-selector">
        <div id="dhikrSelectDisplay" class="dhikr-select-display">
          <div class="dhikr-select-center">
            <span id="dhikrSelectedText" class="dhikr-selected-text">Subhanallah</span>
            <span id="dhikrSelectedArabic" class="dhikr-selected-arabic">سُبْحَانَ ٱللَّٰهِ</span>
          </div>
          <span class="dhikr-select-arrow">▼</span>
        </div>
        <div id="dhikrDropdown" class="dhikr-dropdown">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- Count wrapper — FIXED size, clickable to increment -->
      <div id="countWrap" class="count-wrap" title="Tap to count">
        <div id="countDisplay" class="count-display">0</div>
      </div>

      <!-- Target row -->
      <div class="target-row">
        <span class="target-label">🎯 Target</span>
        <div class="target-input-wrap">
          <input id="targetInput" class="target-input" type="number" min="1" max="999999" step="1" value="33" inputmode="numeric" aria-label="Target count" />
        </div>
      </div>

      <!-- Progress bar -->
      <div class="progress-ring">
        <div class="ring-track">
          <div id="progressFill" class="ring-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="button-grid">
        <button id="incrementBtn" class="btn btn-primary" title="Count (tap or press space)">
          <span class="btn-icon">📿</span> +1
        </button>
        <button id="decrementBtn" class="btn btn-secondary" title="Decrease count">
          <span class="btn-icon">−</span> -1
        </button>
      </div>

      <div class="button-grid" style="margin-top: 6px;">
        <button id="saveSessionBtn" class="btn btn-secondary" title="Save this session">
          <span class="btn-icon">💾</span> Save

          <span class="btn-icon">↺</span> Reset
        </button>

      <div class="footer-row">

          <span id="dhikrTranslationEn" class="en">Glory be to Allah</span>

        </div>

  </div>

  <!-- ================= FLOATING HEARTS LAYER ================= -->
  <div id="heartLayer" class="heart-layer"></div>

  <!-- ================= CONGRATULATIONS OVERLAY ================= -->
  <div id="congratsOverlay" class="congrats-overlay">
    <div class="congrats-card">
      <div class="congrats-emoji">💖</div>
      <div class="congrats-title">MashaAllah!</div>
      <div class="congrats-subtitle">You did it! 🌸</div>
      <div class="congrats-detail">You completed <strong id="congratsCount">33</strong> × <span id="congratsDhikr">Subhanallah</span></div>

  </div>

  <!-- ================= HISTORY MODAL ================= -->
  <div id="historyModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">📜 Saved Sessions</span>
        <button id="closeHistoryBtn" class="modal-close" aria-label="Close">✕</button>

      <div id="historyList" class="modal-body">
        <!-- populated by JS -->
      </div>

        <button id="closeHistoryBtn2" class="modal-btn">Close</button>

  <!-- ================= ADD/EDIT DHIKR MODAL ================= -->
  <div id="dhikrModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span id="dhikrModalTitle" class="modal-title">➕ Add New Dhikr</span>
        <button id="closeDhikrBtn" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="dhikrNameInput">Name (English)</label>

        <div class="form-group">
          <label class="form-label" for="dhikrTranslationInput">English Meaning</label>

        </div>
        <div class="form-group">
          <label class="form-label" for="dhikrTranslationBnInput">Bangla Meaning</label>
          <input id="dhikrTranslationBnInput" class="form-input" type="text" maxlength="80" placeholder="আল্লাহ পবিত্র, মহান" />
        </div>
        <div class="form-group">
          <label class="form-label" for="dhikrTargetInput">Default Target (up to 6 digits)</label>
          <input id="dhikrTargetInput" class="form-input" type="number" min="1" max="999999" step="1" value="33" inputmode="numeric" />

  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast">
    <span>✓</span> <span id="toastText">Saved</span>
  </div>

  <script>
    (function(){
      'use strict';

      // ========== STORAGE KEYS ==========
      const KEYS = {
        DHIKRS: 'tasbeeh_dhikrs_v10',
        ACTIVE: 'tasbeeh_active_v10',
        HISTORY: 'tasbeeh_history_v10'
      };

      const MAX_COUNT = 999999;
      const MAX_HISTORY = 50;

      // ========== DEFAULT DHIKRS ==========
      const DEFAULT_DHIKRS = [
        { id: 'subhanallah',     name: 'Subhanallah',                 arabic: 'سُبْحَانَ ٱللَّٰهِ',                       translation: 'Glory be to Allah',                       translationBn: 'আল্লাহ পবিত্র, মহান',                       count: 0, target: 33  },
        { id: 'alhamdulillah',   name: 'Alhamdulillah',               arabic: 'ٱلْحَمْدُ لِلَّٰهِ',                       translation: 'All praise is for Allah',                 translationBn: 'সকল প্রশংসা আল্লাহর জন্য',                 count: 0, target: 33  },
        { id: 'allahuakbar',     name: 'Allahu Akbar',                arabic: 'ٱللَّٰهُ أَكْبَرُ',                       translation: 'Allah is the Greatest',                   translationBn: 'আল্লাহ সর্বশ্রেষ্ঠ',                       count: 0, target: 34  },
        { id: 'lailahaillallah', name: 'La ilaha illallah',           arabic: 'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ',             translation: 'There is no god but Allah',               translationBn: 'আল্লাহ ছাড়া কোনো উপাস্য নেই',             count: 0, target: 100 },
        { id: 'astaghfirullah',  name: 'Astaghfirullah',              arabic: 'أَسْتَغْفِرُ ٱللَّٰهَ',                   translation: 'I seek forgiveness from Allah',           translationBn: 'আমি আল্লাহর কাছে ক্ষমা চাই',               count: 0, target: 100 },
        { id: 'salawat',         name: 'Allahumma Salli Ala Muhammad', arabic: 'اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ',       translation: 'O Allah, send blessings upon Muhammad',    translationBn: 'হে আল্লাহ, মুহাম্মদের উপর রহমত বর্ষণ করুন', count: 0, target: 100 },
        { id: 'lahawla',         name: 'La hawla wa la quwwata',      arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّٰهِ', translation: 'No power except with Allah',             translationBn: 'আল্লাহর সাহায্য ছাড়া কোনো শক্তি নেই',       count: 0, target: 100 }
      ];

      // ========== STATE ==========
      let dhikrs = [];
      let activeId = null;
      let history = [];
      let congratsShownFor = null; // {dhikrId, target} — prevent repeat celebration

      // ========== DOM ==========
      const $ = id => document.getElementById(id);
      const dhikrSelectDisplay = $('dhikrSelectDisplay');
      const dhikrSelectedText = $('dhikrSelectedText');
      const dhikrSelectedArabic = $('dhikrSelectedArabic');
      const dhikrDropdown = $('dhikrDropdown');
      const countWrap = $('countWrap');
      const countDisplay = $('countDisplay');
      const targetInput = $('targetInput');
      const progressFill = $('progressFill');
      const incrementBtn = $('incrementBtn');
      const decrementBtn = $('decrementBtn');
      const resetBtn = $('resetBtn');
      const saveSessionBtn = $('saveSessionBtn');
      const saveIndicator = $('saveIndicator');
      const historyBtn = $('historyBtn');
      const dhikrTranslationEn = $('dhikrTranslationEn');
      const dhikrTranslationBn = $('dhikrTranslationBn');

      const congratsOverlay = $('congratsOverlay');
      const congratsCount = $('congratsCount');
      const congratsDhikr = $('congratsDhikr');
      const heartLayer = $('heartLayer');

      const historyModal = $('historyModal');
      const historyList = $('historyList');
      const closeHistoryBtn = $('closeHistoryBtn');
      const closeHistoryBtn2 = $('closeHistoryBtn2');
      const clearHistoryBtn = $('clearHistoryBtn');

      const dhikrModal = $('dhikrModal');
      const dhikrModalTitle = $('dhikrModalTitle');
      const dhikrNameInput = $('dhikrNameInput');
      const dhikrArabicInput = $('dhikrArabicInput');
      const dhikrTranslationInput = $('dhikrTranslationInput');
      const dhikrTranslationBnInput = $('dhikrTranslationBnInput');
      const dhikrTargetInput = $('dhikrTargetInput');
      const closeDhikrBtn = $('closeDhikrBtn');
      const cancelDhikrBtn = $('cancelDhikrBtn');
      const saveDhikrBtn = $('saveDhikrBtn');

      const toast = $('toast');
      const toastText = $('toastText');

      let editingDhikrId = null;

      // ========== HELPERS ==========
      function getActive() {
        return dhikrs.find(d => d.id === activeId) || dhikrs[0];
      }

      function uid() {
        return 'dhikr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      }

      function sanitizeTarget(raw) {
        let n = parseInt(raw, 10);
        if (isNaN(n) || n < 1) return 1;
        if (n > MAX_COUNT) return MAX_COUNT;
        return n;
      }

      let toastTimer = null;
      function showToast(msg) {
        toastText.textContent = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      // ========== SAVE INDICATOR ==========
      let saveTimeout = null;
      function showSaveIndicator() {
        saveIndicator.classList.add('show');
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => saveIndicator.classList.remove('show'), 1200);
      }

      // ========== STORAGE ==========
      function saveAll() {
        try {
          localStorage.setItem(KEYS.DHIKRS, JSON.stringify(dhikrs));
          localStorage.setItem(KEYS.ACTIVE, activeId);
          showSaveIndicator();
        } catch (e) {
          console.warn('Save failed:', e);
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(KEYS.HISTORY, JSON.stringify(history));
        } catch (e) {
          console.warn('History save failed:', e);
        }
      }

      let saveDebounceTimer = null;
      function saveDebounced() {
        showSaveIndicator();
        if (saveDebounceTimer) clearTimeout(saveDebounceTimer);
        saveDebounceTimer = setTimeout(() => {
          try {
            localStorage.setItem(KEYS.DHIKRS, JSON.stringify(dhikrs));
            localStorage.setItem(KEYS.ACTIVE, activeId);
          } catch (e) {
            console.warn('Save failed:', e);
          }
        }, 400);
      }

      function loadAll() {
        try {
          const rawDhikrs = localStorage.getItem(KEYS.DHIKRS);
          const rawActive = localStorage.getItem(KEYS.ACTIVE);
          const rawHistory = localStorage.getItem(KEYS.HISTORY);

          if (rawDhikrs) {
            const parsed = JSON.parse(rawDhikrs);
            if (Array.isArray(parsed) && parsed.length > 0) {
              dhikrs = parsed.filter(d => d && d.id && typeof d.count === 'number');
              dhikrs.forEach(d => {
                d.target = sanitizeTarget(d.target);
                if (d.count > MAX_COUNT) d.count = MAX_COUNT;
                if (d.count < 0) d.count = 0;
                if (typeof d.translationBn !== 'string') d.translationBn = '';
              });
            }
          }

          if (!dhikrs.length) {
            const oldV9 = localStorage.getItem('tasbeeh_dhikrs_v9');
            if (oldV9) {
              try {
                const parsed = JSON.parse(oldV9);
                if (Array.isArray(parsed) && parsed.length > 0) {
                  dhikrs = parsed.filter(d => d && d.id && typeof d.count === 'number');
                  dhikrs.forEach(d => {
                    d.target = sanitizeTarget(d.target);
                    if (typeof d.translationBn !== 'string') d.translationBn = '';
                  });
                }
              } catch (e) {}
            }
            if (!dhikrs.length) {
              dhikrs = JSON.parse(JSON.stringify(DEFAULT_DHIKRS));
            }
          }

          if (rawActive && dhikrs.some(d => d.id === rawActive)) {
            activeId = rawActive;
          } else {
            activeId = dhikrs[0].id;
          }

          if (rawHistory) {
            const parsed = JSON.parse(rawHistory);
            if (Array.isArray(parsed)) {
              history = parsed.filter(h =>
                h && typeof h.count === 'number' &&
                typeof h.timestamp === 'number' &&
                typeof h.dhikrId === 'string'
              ).slice(0, MAX_HISTORY);
            }
          }
        } catch (e) {
          console.warn('Load failed:', e);
          dhikrs = JSON.parse(JSON.stringify(DEFAULT_DHIKRS));
          activeId = dhikrs[0].id;
        }
      }

      // ========== CELEBRATION ==========
      let heartInterval = null;
      let heartTimeouts = [];

      function spawnFloatingHeart() {
        const heart = document.createElement('div');
        const variants = ['h-pink', 'h-red', 'h-peach', 'h-lav'];
        const anims = ['floatHeart1', 'floatHeart2', 'floatHeart3', 'floatHeart4', 'floatHeart5'];

        heart.className = 'floating-heart ' + variants[Math.floor(Math.random() * variants.length)];

        // Use mix of heart and sparkle emojis
        const emojis = ['❤️', '💖', '💗', '💓', '💕', '🌸', '✨', '💝'];
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        // Random start position along the bottom of the screen
        const startX = Math.random() * 100; // vw
        const startY = 90 + Math.random() * 10; // bottom area

        heart.style.left = startX + 'vw';
        heart.style.top = startY + 'vh';
        heart.style.fontSize = (1.4 + Math.random() * 1.6) + 'rem';

        const animName = anims[Math.floor(Math.random() * anims.length)];
        const duration = 3.5 + Math.random() * 2.5; // 3.5–6 seconds

        heart.style.animation = `${animName} ${duration}s ease-out forwards`;

        // Optional horizontal drift via CSS variable (used by animation)
        heartLayer.appendChild(heart);

        // Auto-remove after animation completes
        const timeout = setTimeout(() => {
          if (heart.parentNode) heart.parentNode.removeChild(heart);
        }, duration * 1000 + 200);
        heartTimeouts.push(timeout);
      }

      function startHeartRain() {
        stopHeartRain();
        // Burst of hearts initially
        for (let i = 0; i < 14; i++) {
          setTimeout(spawnFloatingHeart, i * 90);
        }
        // Continue spawning for a few seconds
        let count = 0;
        heartInterval = setInterval(() => {
          if (count >= 20) {
            stopHeartRain();
            return;
          }
          spawnFloatingHeart();
          count++;
        }, 260);
      }

      function stopHeartRain() {
        if (heartInterval) {
          clearInterval(heartInterval);
          heartInterval = null;
        }
        heartTimeouts.forEach(t => clearTimeout(t));
        heartTimeouts = [];
      }

      let congratsTimer = null;
      let congratsHideTimer = null;

      function showCongratulations(dhikr) {
        // Set content
        congratsCount.textContent = dhikr.target;
        congratsDhikr.textContent = dhikr.name;

        // Show overlay
        congratsOverlay.classList.add('show');

        // Start floating hearts
        startHeartRain();

        // Vibration pattern for celebration
        if (navigator.vibrate) {
          navigator.vibrate([40, 60, 40, 60, 80]);
        }

        // Hide after 3.5 seconds
        if (congratsHideTimer) clearTimeout(congratsHideTimer);
        congratsHideTimer = setTimeout(() => {
          congratsOverlay.classList.remove('show');
          stopHeartRain();
        }, 3500);
      }

      // ========== UI RENDER ==========
      function updateUI() {
        const d = getActive();
        if (!d) return;

        countDisplay.textContent = d.count;

        // Auto-shrink font based on digit count (container stays same)
        const len = String(d.count).length;
        if (len >= 3) {
          countDisplay.setAttribute('data-len', String(Math.min(len, 6)));
        } else {
          countDisplay.removeAttribute('data-len');
        }

        targetInput.value = d.target;
        dhikrSelectedText.textContent = d.name;
        dhikrSelectedArabic.textContent = d.arabic || '';
        dhikrTranslationEn.textContent = d.translation || '';
        dhikrTranslationBn.textContent = d.translationBn || '';

        if (d.target > 0) {
          let percent = (d.count / d.target) * 100;
          if (percent > 100) percent = 100;
          progressFill.style.width = percent + '%';
        } else {
          progressFill.style.width = '0%';
        }

        // Target reached state — visual highlight
        const reached = d.count >= d.target && d.target > 0;
        if (reached) {
          countWrap.classList.add('target-reached');
          countDisplay.classList.add('target-reached');
          targetInput.style.background = '#3b8b4b';
          targetInput.style.color = '#fff9e6';
          targetInput.style.borderColor = '#dcf5c0';
        } else {
          countWrap.classList.remove('target-reached');
          countDisplay.classList.remove('target-reached');
          targetInput.style.background = '#1f4f30';
          targetInput.style.color = '#dcf5c0';
          targetInput.style.borderColor = '#6fa87f';
        }
      }

      function renderDropdown() {
        dhikrDropdown.innerHTML = '';

        dhikrs.forEach(d => {
          const opt = document.createElement('div');
          opt.className = 'dhikr-option' + (d.id === activeId ? ' active' : '');
          opt.dataset.id = d.id;

          const info = document.createElement('div');
          info.className = 'dhikr-option-info';

          const nameEl = document.createElement('div');
          nameEl.className = 'dhikr-option-name';
          nameEl.textContent = d.name;
          info.appendChild(nameEl);

          if (d.arabic) {
            const ar = document.createElement('div');
            ar.className = 'dhikr-option-arabic';
            ar.textContent = d.arabic;
            info.appendChild(ar);
          }

          const stats = document.createElement('div');
          stats.className = 'dhikr-option-stats';

          const cEl = document.createElement('div');
          cEl.className = 'dhikr-option-count';
          cEl.textContent = d.count;
          stats.appendChild(cEl);

          const tEl = document.createElement('div');
          tEl.className = 'dhikr-option-target';
          tEl.textContent = '/ ' + d.target;
          stats.appendChild(tEl);

          const del = document.createElement('button');
          del.className = 'dhikr-option-delete';
          del.textContent = '🗑';
          del.title = 'Delete this dhikr';
          del.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteDhikr(d.id);
          });

          opt.appendChild(info);
          opt.appendChild(stats);
          if (dhikrs.length > 1) opt.appendChild(del);

          opt.addEventListener('click', () => {
            switchDhikr(d.id);
            closeDropdown();
          });

          opt.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            openEditDhikr(d.id);
          });

          dhikrDropdown.appendChild(opt);
        });

        const divider = document.createElement('div');
        divider.className = 'dhikr-divider';
        dhikrDropdown.appendChild(divider);

        const addBtn = document.createElement('div');
        addBtn.className = 'dhikr-add-btn';
        addBtn.innerHTML = '<span>➕</span> Add New Dhikr';
        addBtn.addEventListener('click', () => {
          openAddDhikr();
          closeDropdown();
        });
        dhikrDropdown.appendChild(addBtn);
      }

      // ========== DROPDOWN ==========
      function openDropdown() {
        dhikrSelectDisplay.classList.add('open');
        dhikrDropdown.classList.add('show');
        renderDropdown();
      }

      function closeDropdown() {
        dhikrSelectDisplay.classList.remove('open');
        dhikrDropdown.classList.remove('show');
      }

      function toggleDropdown() {
        if (dhikrDropdown.classList.contains('show')) closeDropdown();
        else openDropdown();
      }

      // ========== DHIKR ACTIONS ==========
      function switchDhikr(id) {
        if (id === activeId) return;
        activeId = id;
        // Reset the "congrats shown" state so celebration fires once per new dhikr
        congratsShownFor = null;
        updateUI();
        saveAll();
      }

      function deleteDhikr(id) {
        if (dhikrs.length <= 1) {
          alert('You need at least one dhikr.');
          return;
        }
        const d = dhikrs.find(x => x.id === id);
        if (!d) return;
        if (!confirm(`Delete "${d.name}" and its saved count (${d.count})?`)) return;

        dhikrs = dhikrs.filter(x => x.id !== id);
        history = history.filter(h => h.dhikrId !== id);
        saveHistory();
        if (activeId === id) activeId = dhikrs[0].id;
        saveAll();
        updateUI();
        renderDropdown();
      }

      function increment() {
        const d = getActive();
        if (!d) return;
        if (d.count < MAX_COUNT) d.count++;

        const wasBelowTarget = (d.count - 1) < d.target;
        const nowAtTarget = d.count >= d.target;

        updateUI();
        pulseDisplay();
        saveDebounced();
        if (navigator.vibrate) navigator.vibrate(10);

        // Trigger celebration once when crossing the target threshold
        if (wasBelowTarget && nowAtTarget && d.target > 0) {
          if (!congratsShownFor || congratsShownFor.dhikrId !== d.id || congratsShownFor.target !== d.target) {
            congratsShownFor = { dhikrId: d.id, target: d.target };
            showCongratulations(d);
          }
        }
      }

      function decrement() {
        const d = getActive();
        if (!d) return;
        if (d.count > 0) {
          d.count--;
          // If dropped below target, allow celebration to fire again if they hit it again
          if (d.count < d.target) {
            congratsShownFor = null;
          }
          updateUI();
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 100);
          saveDebounced();
        } else {
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 100);
        }
      }

      function resetCounter() {
        const d = getActive();
        if (!d) return;
        if (d.count === 0) {
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 200);
          return;
        }
        upsertHistoryEntry(d);
        d.count = 0;
        congratsShownFor = null;
        updateUI();
        countDisplay.classList.add('pulse');
        setTimeout(() => countDisplay.classList.remove('pulse'), 200);
        saveAll();
        if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
      }

      function pulseDisplay() {
        countDisplay.classList.add('pulse');
        setTimeout(() => countDisplay.classList.remove('pulse'), 150);
      }

      function applyTargetFromInput() {
        const d = getActive();
        if (!d) return;
        d.target = sanitizeTarget(targetInput.value);
        targetInput.value = d.target;
        // Reset celebration flag if target changed
        if (congratsShownFor && congratsShownFor.target !== d.target) {
          congratsShownFor = null;
        }
        updateUI();
        saveAll();
      }

      // ========== HISTORY ==========
      function upsertHistoryEntry(dhikr) {
        if (!dhikr || dhikr.count <= 0) return;
        history = history.filter(h => h.dhikrId !== dhikr.id);
        history.unshift({
          dhikrId: dhikr.id,
          name: dhikr.name,
          count: dhikr.count,
          timestamp: Date.now()
        });
        if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
        saveHistory();
      }

      function renderHistory() {
        historyList.innerHTML = '';

        if (!history.length) {
          const e = document.createElement('div');
          e.className = 'empty-history';
          e.textContent = 'No saved sessions yet. Tap 💾 Save to store a session.';
          historyList.appendChild(e);
          return;
        }

        const hint = document.createElement('div');
        hint.className = 'history-hint';
        hint.textContent = '👆 Tap a session to restore its count';
        historyList.appendChild(hint);

        history.forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.title = 'Tap to restore this count';

          const info = document.createElement('div');
          info.className = 'h-info';

          const name = document.createElement('span');
          name.className = 'h-name';
          name.textContent = item.name;

          const time = document.createElement('span');
          time.className = 'h-time';
          time.textContent = formatTime(item.timestamp);

          info.appendChild(name);
          info.appendChild(time);

          const countEl = document.createElement('span');
          countEl.className = 'h-count';
          countEl.textContent = item.count;

          div.appendChild(info);
          div.appendChild(countEl);

          div.addEventListener('click', () => {
            restoreHistoryEntry(item);
          });

          historyList.appendChild(div);
        });
      }

      function restoreHistoryEntry(item) {
        const d = dhikrs.find(x => x.id === item.dhikrId);
        if (!d) {
          showToast('Dhikr no longer exists');
          return;
        }

        if (activeId !== d.id) {
          activeId = d.id;
        }

        d.count = Math.min(item.count, MAX_COUNT);
        congratsShownFor = null;
        updateUI();
        saveAll();
        closeHistory();
        showToast(`Restored: ${d.name} → ${d.count}`);
        if (navigator.vibrate) navigator.vibrate(20);
      }

      function formatTime(ts) {
        const d = new Date(ts);
        const now = new Date();
        if (d.toDateString() === now.toDateString()) {
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }

      function openHistory() {
        renderHistory();
        historyModal.classList.add('show');
      }
      function closeHistory() {
        historyModal.classList.remove('show');
      }
      function clearHistory() {
        if (!history.length) return;
        if (confirm('Clear all saved sessions?')) {
          history = [];
          saveHistory();
          renderHistory();
        }
      }

      // ========== ADD / EDIT DHIKR ==========
      function openAddDhikr() {
        editingDhikrId = null;
        dhikrModalTitle.textContent = '➕ Add New Dhikr';
        dhikrNameInput.value = '';
        dhikrArabicInput.value = '';
        dhikrTranslationInput.value = '';
        dhikrTranslationBnInput.value = '';
        dhikrTargetInput.value = 33;
        dhikrModal.classList.add('show');
        setTimeout(() => dhikrNameInput.focus(), 100);
      }

      function openEditDhikr(id) {
        const d = dhikrs.find(x => x.id === id);
        if (!d) return;
        editingDhikrId = id;
        dhikrModalTitle.textContent = '✏️ Edit Dhikr';
        dhikrNameInput.value = d.name;
        dhikrArabicInput.value = d.arabic || '';
        dhikrTranslationInput.value = d.translation || '';
        dhikrTranslationBnInput.value = d.translationBn || '';
        dhikrTargetInput.value = d.target;
        dhikrModal.classList.add('show');
      }

      function closeDhikrModal() {
        dhikrModal.classList.remove('show');
        editingDhikrId = null;
      }

      function saveDhikrFromModal() {
        const name = dhikrNameInput.value.trim();
        if (!name) {
          alert('Please enter a name for the dhikr.');
          dhikrNameInput.focus();
          return;
        }
        const arabic = dhikrArabicInput.value.trim();
        const translation = dhikrTranslationInput.value.trim();
        const translationBn = dhikrTranslationBnInput.value.trim();
        const targetVal = sanitizeTarget(dhikrTargetInput.value);

        if (editingDhikrId) {
          const d = dhikrs.find(x => x.id === editingDhikrId);
          if (d) {
            d.name = name;
            d.arabic = arabic;
            d.translation = translation;
            d.translationBn = translationBn;
            d.target = targetVal;
            const h = history.find(x => x.dhikrId === d.id);
            if (h) {
              h.name = name;
              saveHistory();
            }
          }
        } else {
          const newDhikr = {
            id: uid(),
            name,
            arabic,
            translation,
            translationBn,
            count: 0,
            target: targetVal
          };
          dhikrs.push(newDhikr);
          activeId = newDhikr.id;
        }

        congratsShownFor = null;
        saveAll();
        updateUI();
        closeDhikrModal();
      }

      // ========== EVENT LISTENERS ==========
      incrementBtn.addEventListener('click', increment);
      decrementBtn.addEventListener('click', decrement);
      resetBtn.addEventListener('click', resetCounter);
      countWrap.addEventListener('click', increment);

      saveSessionBtn.addEventListener('click', () => {
        const d = getActive();
        if (!d || d.count <= 0) {
          showToast('Nothing to save yet');
          return;
        }
        upsertHistoryEntry(d);
        showSaveIndicator();
        showToast(`Saved: ${d.name} → ${d.count}`);
        if (navigator.vibrate) navigator.vibrate(15);
      });

      dhikrSelectDisplay.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDropdown();
      });

      document.addEventListener('click', (e) => {
        if (!dhikrSelectDisplay.contains(e.target) && !dhikrDropdown.contains(e.target)) {
          closeDropdown();
        }
      });

      targetInput.addEventListener('input', () => {
        const d = getActive();
        if (!d) return;

        let raw = targetInput.value.replace(/\D/g, '');
        if (raw.length > 6) raw = raw.slice(0, 6);
        if (raw === '') {
          targetInput.value = '';
          return;
        }
        if (raw !== targetInput.value) {
          targetInput.value = raw;
        }

        const parsed = parseInt(raw, 10);
        if (!isNaN(parsed) && parsed >= 1) {
          d.target = Math.min(parsed, MAX_COUNT);
          updateUI();
          saveDebounced();
        }
      });

      targetInput.addEventListener('blur', applyTargetFromInput);
      targetInput.addEventListener('change', applyTargetFromInput);
      targetInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          targetInput.blur();
          applyTargetFromInput();
        }
        e.stopPropagation();
      });

      historyBtn.addEventListener('click', openHistory);
      closeHistoryBtn.addEventListener('click', closeHistory);
      closeHistoryBtn2.addEventListener('click', closeHistory);
      clearHistoryBtn.addEventListener('click', clearHistory);
      historyModal.addEventListener('click', (e) => {
        if (e.target === historyModal) closeHistory();
      });

      closeDhikrBtn.addEventListener('click', closeDhikrModal);
      cancelDhikrBtn.addEventListener('click', closeDhikrModal);
      saveDhikrBtn.addEventListener('click', saveDhikrFromModal);
      dhikrModal.addEventListener('click', (e) => {
        if (e.target === dhikrModal) closeDhikrModal();
      });

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === targetInput) return;
        if (document.activeElement === dhikrNameInput ||
            document.activeElement === dhikrArabicInput ||
            document.activeElement === dhikrTranslationInput ||
            document.activeElement === dhikrTranslationBnInput ||
            document.activeElement === dhikrTargetInput) return;

        if (historyModal.classList.contains('show')) {
          if (e.key === 'Escape') closeHistory();
          return;
        }
        if (dhikrModal.classList.contains('show')) {
          if (e.key === 'Escape') closeDhikrModal();
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveDhikrFromModal();
          return;
        }

        if (e.key === ' ' || e.key === 'Space' || e.key === '+' || e.key === 'ArrowUp' || e.key === 'Enter') {
          e.preventDefault();
          increment();
        } else if (e.key === '-' || e.key === 'ArrowDown') {
          e.preventDefault();
          decrement();
        } else if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetCounter();
        } else if (e.key === 'h' || e.key === 'H') {
          e.preventDefault();
          openHistory();
        } else if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          saveSessionBtn.click();
        } else if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          openAddDhikr();
        } else if (e.key === 'Escape') {
          closeDropdown();
        }
      });

      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

      window.addEventListener('beforeunload', saveAll);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) saveAll();
      });

      // ========== INIT ==========
      loadAll();
      updateUI();
      renderDropdown();

    })();
  </script>
</body>
</html>

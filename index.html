<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d2b1c">

  <!-- ===== PWA Meta Tags ===== -->
  <meta name="description" content="A beautiful digital Tasbeeh counter with Arabic dhikr, daily duas, English and Bangla meanings, session history, and target tracking.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasbeeh">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- ===== Developer / Author Info ===== -->
  <meta name="author" content="Shah Kabir">
  <meta name="developer" content="Shah Kabir">
  <meta name="copyright" content="© 2026 Shah Kabir. All rights reserved.">

  <!-- ===== Manifest ===== -->
  <link rel="manifest" href="manifest.json">

  <!-- ===== Icons ===== -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <title>Tasbeeh — Dhikr Counter</title>

  <!-- ===== Fonts ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06231a;
      font-family: 'Segoe UI', Roboto, 'Noto Sans Bengali', 'Kalpurush', system-ui, -apple-system, sans-serif;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      margin: 0;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(159, 223, 159, 0.18), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(46, 122, 72, 0.28), transparent 60%),
        linear-gradient(180deg, #0b2a1e 0%, #06231a 100%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.14;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><defs><pattern id='p' x='0' y='0' width='120' height='120' patternUnits='userSpaceOnUse'><g fill='none' stroke='%23bbf0bb' stroke-width='1.1'><path d='M60 10 L75 30 L100 30 L85 50 L95 75 L60 58 L25 75 L35 50 L20 30 L45 30 Z'/><path d='M60 25 L70 38 L88 38 L78 50 L85 68 L60 56 L35 68 L42 50 L32 38 L50 38 Z'/><circle cx='60' cy='48' r='5' fill='%23bbf0bb' opacity='0.6'/><circle cx='60' cy='48' r='10' fill='none' stroke='%23bbf0bb' opacity='0.4'/><path d='M0 0 L15 0 M0 15 L0 0 M120 0 L105 0 M120 15 L120 0 M0 120 L15 120 M0 105 L0 120 M120 120 L105 120 M120 105 L120 120'/></g></pattern></defs><rect width='240' height='240' fill='url(%23p)'/></svg>");
      background-size: 240px 240px;
      background-repeat: repeat;
      pointer-events: none;
    }

    /* ================================================================
       SHARED LAYOUT — identical for Tasbeeh and Duas
       ================================================================ */

    .app-shell {
      background: rgba(13, 43, 28, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 48px;
      padding: 20px 16px 24px;
      box-shadow: 0 30px 55px -20px rgba(0, 0, 0, 0.85), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      width: 100%;
      max-width: 480px;
      height: min(760px, calc(100dvh - 24px));
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .app-card {
      background: rgba(13, 43, 28, 0.95);
      border-radius: 40px;
      padding: 20px 16px 18px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6), 0 10px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid #3b6e4b;
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .app-card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400' preserveAspectRatio='xMidYMid slice'><g fill='none' stroke='%239fdf9f' stroke-width='1.2'><path d='M200 80 Q 130 120 130 200 L 130 320 L 270 320 L 270 200 Q 270 120 200 80 Z'/><path d='M200 100 Q 145 135 145 205 L 145 315 L 255 315 L 255 205 Q 255 135 200 100 Z'/><path d='M200 60 L 200 80 M 200 55 L 210 70 L 200 65 L 190 70 Z' fill='%239fdf9f' opacity='0.7'/><circle cx='200' cy='55' r='4' fill='%239fdf9f' opacity='0.9'/><path d='M40 320 L 40 200 Q 40 170 60 160 M 40 320 L 90 320'/><path d='M360 320 L 360 200 Q 360 170 340 160 M 360 320 L 310 320'/><path d='M120 320 L 120 250 M 280 320 L 280 250'/><line x1='40' y1='340' x2='360' y2='340'/><line x1='30' y1='360' x2='370' y2='360'/><path d='M200 160 L 190 175 L 200 190 L 210 175 Z' fill='%239fdf9f' opacity='0.5'/></g></svg>");
      background-size: cover;
      background-position: center 20%;
      background-repeat: no-repeat;
    }

    .app-card::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(212, 255, 176, 0.12), transparent 70%),
        radial-gradient(ellipse 90% 50% at 50% 100%, rgba(46, 122, 72, 0.18), transparent 70%);
    }

    .app-card > * {
      position: relative;
      z-index: 2;
    }

    .app-content {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    /* ================================================================
       MAIN SCREEN — TASBEEH
       ================================================================ */

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      min-height: 26px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .top-bar-left {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .save-indicator {
      font-size: 0.7rem;
      font-weight: 600;
      color: #9fdf9f;
      background: rgba(31, 79, 48, 0.95);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #589b6b;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .save-indicator.show { opacity: 1; }

    .save-indicator .dot {
      width: 6px; height: 6px;
      background: #d4ffb0;
      border-radius: 50%;
      box-shadow: 0 0 6px #d4ffb0;
    }

    .top-btn {
      background: rgba(31, 79, 48, 0.85);
      border: 1px solid #589b6b;
      color: #c6e6b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .top-btn:active { transform: scale(0.95); background: rgba(59, 139, 75, 0.95); }

    .sound-btn {
      background: rgba(31, 79, 48, 0.85);
      border: 1px solid #589b6b;
      color: #c6e6b8;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .sound-btn:active { transform: scale(0.95); }
    .sound-btn.muted {
      background: rgba(94, 58, 30, 0.85);
      border-color: #bb8f5a;
      color: #ffd9a0;
    }

    .dhikr-selector {
      position: relative;
      margin-bottom: 8px;
      z-index: 30;
    }

    .dhikr-select-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18, 51, 31, 0.92);
      border: 1px solid #3f6b4b;
      border-radius: 24px;
      padding: 10px 16px;
      cursor: pointer;
      transition: all 0.15s;
      gap: 8px;
      min-height: 62px;
      backdrop-filter: blur(6px);
    }

    .dhikr-select-display:active {
      background: rgba(26, 68, 41, 0.95);
      transform: scale(0.99);
    }

    .dhikr-select-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .dhikr-selected-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: #e9f7d6;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.2;
    }

    .dhikr-selected-arabic {
      font-size: 1.1rem;
      color: #9fdf9f;
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade', serif;
      direction: rtl;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.3;
      min-height: 1.3em;
    }

    .dhikr-select-arrow {
      color: #9fdf9f;
      font-size: 0.8rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .dhikr-select-display.open .dhikr-select-arrow {
      transform: rotate(180deg);
    }

    .dhikr-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0f2e1d;
      border: 1px solid #3f6b4b;
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9);
      z-index: 40;
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dhikr-dropdown.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dhikr-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 8px;
    }

    .dhikr-option:hover { background: #1a4429; }
    .dhikr-option:active { background: #22633a; }

    .dhikr-option.active {
      background: #2e7a48;
      box-shadow: inset 0 0 0 1px #8fd49c;
    }

    .dhikr-option-info { flex: 1; min-width: 0; }

    .dhikr-option-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e9f7d6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dhikr-option-arabic {
      font-size: 0.78rem;
      color: #8fb898;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade', serif;
      direction: rtl;
      text-align: right;
    }

    .dhikr-option-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .dhikr-option-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: #d4ffb0;
      font-variant-numeric: tabular-nums;
    }

    .dhikr-option-target {
      font-size: 0.65rem;
      color: #7fa588;
    }

    .dhikr-option-delete {
      background: transparent;
      border: none;
      color: #d47a5a;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      opacity: 0.6;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .dhikr-option-delete:hover { opacity: 1; background: rgba(94, 58, 30, 0.5); }

    .dhikr-divider {
      height: 1px;
      background: #2d5a3b;
      margin: 4px 8px;
    }

    .dhikr-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(46, 122, 72, 0.4);
      border: 1px dashed #589b6b;
      color: #9fdf9f;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dhikr-add-btn:hover { background: rgba(46, 122, 72, 0.7); }
    .dhikr-add-btn:active { transform: scale(0.98); }

    .count-wrap {
      width: 100%;
      flex: 1 1 auto;
      min-height: 140px;
      padding: 4px 12px;
      margin: 8px 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      border-radius: 20px;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.4s ease;
      background: rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .count-wrap:active {
      background: rgba(159, 223, 159, 0.12);
      transform: scale(0.99);
    }

    .count-wrap.target-reached {
      background: rgba(46, 122, 72, 0.15);
      box-shadow: 0 0 24px rgba(159, 223, 159, 0.4),
                  inset 0 0 20px rgba(159, 223, 159, 0.15);
      animation: targetGlow 2.2s ease-in-out infinite;
    }

    @keyframes targetGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(159, 223, 159, 0.35),
                    inset 0 0 18px rgba(159, 223, 159, 0.12);
      }
      50% {
        box-shadow: 0 0 34px rgba(159, 223, 159, 0.6),
                    inset 0 0 24px rgba(159, 223, 159, 0.22);
      }
    }

    .count-display {
      font-size: clamp(4.5rem, 22vw, 9rem);
      font-weight: 900;
      text-align: center;
      color: #e9f7d6;
      text-shadow: 0 0 26px #a3e0a0, 0 14px 0 #0a1f12;
      letter-spacing: 1px;
      line-height: 1;
      word-break: keep-all;
      transition: font-size 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.1s ease, color 0.4s ease;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      display: inline-block;
      max-width: 100%;
      pointer-events: none;
    }

    .count-display.pulse {
      transform: scale(1.05);
      text-shadow: 0 0 45px #d4ffb0, 0 14px 0 #0a1f12;
    }

    .count-display.target-reached {
      color: #f4ffd4;
      text-shadow: 0 0 30px #d4ffb0, 0 14px 0 #0a1f12;
    }

    .count-display[data-len="3"] { font-size: clamp(3.5rem, 18vw, 7rem); }
    .count-display[data-len="4"] { font-size: clamp(2.8rem, 14vw, 5.5rem); }
    .count-display[data-len="5"] { font-size: clamp(2.2rem, 11vw, 4.5rem); }
    .count-display[data-len="6"] { font-size: clamp(1.9rem, 9vw, 3.8rem); }

    .target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 46, 29, 0.95);
      padding: 8px 12px;
      border-radius: 60px;
      margin: 6px 0 12px;
      box-shadow: inset 0 2px 6px #00000055, 0 2px 4px #00000033;
      border: 1px solid #2d5a3b;
      gap: 6px;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }

    .target-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #b6d7b0;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .target-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .target-input {
      width: 150px;
      max-width: 100%;
      padding: 6px 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #dcf5c0;
      background: #1f4f30;
      border: 1px solid #6fa87f;
      border-radius: 40px;
      text-align: center;
      outline: none;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 2px 4px #00000033;
      font-variant-numeric: tabular-nums;
      transition: all 0.15s;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }

    .target-input:focus {
      background: #2b6e40;
      border-color: #bbf0bb;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 0 0 3px rgba(187, 240, 187, 0.25);
    }

    .target-input::-webkit-outer-spin-button,
    .target-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .target-input[type=number] { -moz-appearance: textfield; }

    .progress-ring {
      display: flex;
      justify-content: center;
      margin: 4px 0 10px;
      flex-shrink: 0;
    }

    .ring-track {
      width: 100%;
      height: 10px;
      background: #0b1e13;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px #000000aa;
    }

    .ring-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9fdf9f, #d2f0b0);
      border-radius: 20px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 8px #bbf0bb;
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0 4px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1 1 0;
      min-width: 100px;
      padding: 16px 8px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 60px;
      background: #1f4a2d;
      color: #f0ffe0;
      box-shadow: 0 8px 0 #0b1f11, 0 6px 12px #00000055;
      transition: all 0.06s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #589b6b;
      text-shadow: 0 2px 0 #0b1f11;
    }

    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #0b1f11, 0 6px 12px #00000055;
    }

    .btn-primary {
      background: #2e7a48;
      box-shadow: 0 8px 0 #164a26, 0 6px 12px #00000055;
      border-color: #8fd49c;
      font-size: 1.4rem;
    }

    .btn-secondary { background: #1f4a2d; font-size: 1rem; }

    .btn-warning {
      background: #5e3a1e;
      border-color: #bb8f5a;
      box-shadow: 0 8px 0 #33200e, 0 6px 12px #00000055;
      color: #ffe6c7;
      font-size: 1rem;
    }

    .btn-icon { font-size: 1.4rem; filter: drop-shadow(0 2px 2px black); }

    /* ============ FOOTER + DEVELOPER CREDIT ============ */
    .footer-row {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
      padding: 0 4px;
      flex-shrink: 0;
      gap: 6px;
    }

    .dhikr-translation {
      font-weight: 500;
      color: #c6e6b8;
      background: rgba(18, 51, 31, 0.95);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      border: 1px solid #3f6b4b;
      max-width: 100%;
      text-align: center;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .dhikr-translation .en {
      color: #c6e6b8;
      font-weight: 500;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dhikr-translation .bn {
      color: #9fdf9f;
      font-weight: 500;
      font-size: 0.82rem;
      font-family: 'Noto Sans Bengali', 'Kalpurush', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .developer-credit {
      text-align: center;
      font-size: 0.62rem;
      color: #8fb898;
      letter-spacing: 0.4px;
      opacity: 0.9;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 8px;
    }

    .developer-credit strong {
      color: #bbf0bb;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ================================================================
       MODAL — fully opaque outside, identical card inside
       ================================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(159, 223, 159, 0.18), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(46, 122, 72, 0.28), transparent 60%),
        linear-gradient(180deg, #0b2a1e 0%, #06231a 100%);
      display: flex;
      align-items: center;

    .congrats-overlay {

    .heart-layer {
      position: fixed;
      inset: 0;

      z-index: 160;
      overflow: hidden;

    .floating-heart {
      position: absolute;
      font-size: 2rem;
      line-height: 1;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 8px rgba(255, 120, 180, 0.9));
      user-select: none;
      pointer-events: none;
    }

    .floating-heart.h-pink { color: #ff8fc7; }
    .floating-heart.h-red { color: #ff5a7a; }
    .floating-heart.h-peach { color: #ffb3c1; }
    .floating-heart.h-lav { color: #e0b0ff; }

    @keyframes floatHeart1 {
      0%   { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(40px, -220px) scale(1.1) rotate(20deg); opacity: 1; }
      100% { transform: translate(-30px, -520px) scale(0.7) rotate(-25deg); opacity: 0; }
    }
    @keyframes floatHeart2 {
      0%   { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(-60px, -260px) scale(1.2) rotate(-30deg); opacity: 1; }
      100% { transform: translate(50px, -560px) scale(0.6) rotate(35deg); opacity: 0; }
    }
    @keyframes floatHeart3 {
      0%   { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(80px, -180px) scale(1) rotate(15deg); opacity: 1; }
      100% { transform: translate(-70px, -500px) scale(0.5) rotate(-40deg); opacity: 0; }
    }
    @keyframes floatHeart4 {
      0%   { transform: translate(0, 0) scale(0.35) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(-90px, -300px) scale(1.15) rotate(25deg); opacity: 1; }
      100% { transform: translate(60px, -600px) scale(0.65) rotate(-20deg); opacity: 0; }
    }
    @keyframes floatHeart5 {
      0%   { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(120px, -200px) scale(1.05) rotate(-18deg); opacity: 1; }
      100% { transform: translate(-100px, -540px) scale(0.55) rotate(45deg); opacity: 0; }

<body>

  <!-- ================================================================
       MAIN SCREEN — Tasbeeh
       ================================================================ -->
  <div class="app-shell">
    <div class="app-card">
      <div class="top-bar">
        <div class="top-bar-left">
          <button id="historyBtn" class="top-btn" title="View session history">📜 History</button>
          <button id="duasBtn" class="top-btn" title="Daily Duas">🤲 Duas</button>
          <button id="soundToggleBtn" class="sound-btn" title="Toggle sound">🔊</button>
        </div>
        <div id="saveIndicator" class="save-indicator">
          <span class="dot"></span> SAVED
        </div>
      </div>

      <div class="dhikr-selector">
        <div id="dhikrSelectDisplay" class="dhikr-select-display">
          <div class="dhikr-select-center">
            <span id="dhikrSelectedText" class="dhikr-selected-text">Subhanallah</span>
            <span id="dhikrSelectedArabic" class="dhikr-selected-arabic">سُبْحَانَ ٱللَّٰهِ</span>
          </div>
          <span class="dhikr-select-arrow">▼</span>
        </div>
        <div id="dhikrDropdown" class="dhikr-dropdown"></div>
      </div>

      <div id="countWrap" class="count-wrap" title="Tap to count">
        <div id="countDisplay" class="count-display">0</div>
      </div>

      <div class="target-row">
        <span class="target-label">🎯 Target</span>
        <div class="target-input-wrap">
          <input id="targetInput" class="target-input" type="number" min="1" max="999999" step="1" value="33" inputmode="numeric" aria-label="Target count" />
        </div>
      </div>

      <div class="progress-ring">
        <div class="ring-track">
          <div id="progressFill" class="ring-fill" style="width: 0%;"></div>
        </div>
      </div>

      <div class="button-grid">
        <button id="incrementBtn" class="btn btn-primary" title="Count (tap or press space)">
          <span class="btn-icon">📿</span> +1
        </button>
        <button id="decrementBtn" class="btn btn-secondary" title="Decrease count">
          <span class="btn-icon">−</span> -1
        </button>
      </div>

      <div class="button-grid" style="margin-top: 4px;">
        <button id="saveSessionBtn" class="btn btn-secondary" title="Save this session">
          <span class="btn-icon">💾</span> Save
        </button>
        <button id="resetBtn" class="btn btn-warning" title="Reset this dhikr's counter">
          <span class="btn-icon">↺</span> Reset
        </button>
      </div>

      <!-- ============ FOOTER: translation + developer credit ============ -->
      <div class="footer-row">
        <div class="dhikr-translation">
          <span id="dhikrTranslationEn" class="en">Glory be to Allah</span>
          <span id="dhikrTranslationBn" class="bn">আল্লাহ পবিত্র, মহান</span>
        </div>
        <div class="developer-credit">Developed by <strong>Shah Kabir</strong></div>
      </div>
    </div>
  </div>

  <div id="heartLayer" class="heart-layer"></div>

  <div id="congratsOverlay" class="congrats-overlay">
    <div class="congrats-card">
      <div class="congrats-emoji">💖</div>
      <div class="congrats-title">MashaAllah!</div>
      <div class="congrats-subtitle">You did it! 🌸</div>
      <div class="congrats-detail">You completed <strong id="congratsCount">33</strong> × <span id="congratsDhikr">Subhanallah</span></div>
    </div>
  </div>

  <!-- ================================================================
       DUAS MODAL — identical frame to main screen
       ================================================================ -->
  <div id="duasModal" class="modal-overlay">
    <div class="app-shell">
      <div class="app-card">
        <div class="modal-header">
          <span class="modal-title">🤲 Daily Duas</span>
          <button id="closeDuasBtn" class="modal-close" aria-label="Close">✕</button>

        <div class="app-content">
          <div id="duasCategoriesView" class="duas-view">

            <div id="duasCategoriesContainer" class="duas-list"></div>

            <div id="duasInCategoryContainer" class="duas-list"></div>

              <div class="dua-detail-section">
                <div class="dua-detail-label-row">

                <div id="duaDetailBn" class="dua-detail-meaning-bn"></div>
              </div>

              <div class="dua-listen-row">
                <button id="listenAllBtn" class="dua-listen-btn" data-listen="all">🔊 Listen to Full Dua</button>
                <button id="stopListenBtn" class="dua-listen-btn" data-listen="stop" style="display:none;">⏹ Stop</button>
              </div>
            </div>

            <div class="dua-nav">
              <button id="prevDuaBtn" class="dua-nav-btn">← Previous</button>
              <button id="nextDuaBtn" class="dua-nav-btn primary">Next →</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- History modal -->
  <div id="historyModal" class="modal-overlay">
    <div class="app-shell">
      <div class="app-card">
        <div class="modal-header">
          <span class="modal-title">📜 Saved Sessions</span>
          <button id="closeHistoryBtn" class="modal-close" aria-label="Close">✕</button>
        </div>
        <div id="historyList" class="modal-body"></div>
        <div class="modal-footer">
          <button id="clearHistoryBtn" class="modal-btn danger">Clear All</button>
          <button id="closeHistoryBtn2" class="modal-btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Dhikr modal -->
  <div id="dhikrModal" class="modal-overlay">
    <div class="app-shell">
      <div class="app-card">
        <div class="modal-header">
          <span id="dhikrModalTitle" class="modal-title">➕ Add New Dhikr</span>
          <button id="closeDhikrBtn" class="modal-close" aria-label="Close">✕</button>
        </div>
        <div class="modal-body">

            <input id="dhikrTranslationInput" class="form-input" type="text" maxlength="80" placeholder="Glory be to Allah" />
          </div>
          <div class="form-group">

            <input id="dhikrTranslationBnInput" class="form-input" type="text" maxlength="80" placeholder="আল্লাহ পবিত্র, মহান" />
          </div>
          <div class="form-group">
            <label class="form-label" for="dhikrTargetInput">Default Target (up to 6 digits)</label>
            <input id="dhikrTargetInput" class="form-input" type="number" min="1" max="999999" step="1" value="33" inputmode="numeric" />

        <div class="modal-footer">
          <button id="cancelDhikrBtn" class="modal-btn">Cancel</button>

  <script>
    (function(){
      'use strict';

      const KEYS = {
        DHIKRS: 'tasbeeh_dhikrs_v16',
        ACTIVE: 'tasbeeh_active_v16',
        HISTORY: 'tasbeeh_history_v16',
        SOUND: 'tasbeeh_sound_v1'
      };

      const MAX_COUNT = 999999;
      const MAX_HISTORY = 50;

      const DEFAULT_DHIKRS = [
        { id: 'subhanallah',     name: 'Subhanallah',                 arabic: 'سُبْحَانَ ٱللَّٰهِ',                       translation: 'Glory be to Allah',                       translationBn: 'আল্লাহ পবিত্র, মহান',                       count: 0, target: 33  },
        { id: 'alhamdulillah',   name: 'Alhamdulillah',               arabic: 'ٱلْحَمْدُ لِلَّٰهِ',                       translation: 'All praise is for Allah',                 translationBn: 'সকল প্রশংসা আল্লাহর জন্য',                 count: 0, target: 33  },
        { id: 'allahuakbar',     name: 'Allahu Akbar',                arabic: 'ٱللَّٰهُ أَكْبَرُ',                       translation: 'Allah is the Greatest',                   translationBn: 'আল্লাহ সর্বশ্রেষ্ঠ',                       count: 0, target: 34  },
        { id: 'lailahaillallah', name: 'La ilaha illallah',           arabic: 'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ',             translation: 'There is no god but Allah',               translationBn: 'আল্লাহ ছাড়া কোনো উপাস্য নেই',             count: 0, target: 100 },
        { id: 'astaghfirullah',  name: 'Astaghfirullah',              arabic: 'أَسْتَغْفِرُ ٱللَّٰهَ',                   translation: 'I seek forgiveness from Allah',           translationBn: 'আমি আল্লাহর কাছে ক্ষমা চাই',               count: 0, target: 100 },
        { id: 'salawat',         name: 'Allahumma Salli Ala Muhammad', arabic: 'اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ',       translation: 'O Allah, send blessings upon Muhammad',    translationBn: 'হে আল্লাহ, মুহাম্মদের উপর রহমত বর্ষণ করুন', count: 0, target: 100 },
        { id: 'lahawla',         name: 'La hawla wa la quwwata',      arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّٰهِ', translation: 'No power except with Allah',             translationBn: 'আল্লাহর সাহায্য ছাড়া কোনো শক্তি নেই',       count: 0, target: 100 },
        { id: 'rabbizidni',      name: 'Rabbi Zidni Ilma',            arabic: 'رَبِّ زِدْنِي عِلْمًا',                    translation: 'My Lord, increase me in knowledge',       translationBn: 'হে আমার প্রভু, আমার জ্ঞান বাড়িয়ে দিন',      count: 0, target: 100 }
      ];

      const DAILY_DUAS = [
        { category: '🌙 Ramadan & Fasting', title: 'Intention for Fasting (Niyyah)', arabic: 'وَبِصَوْمِ غَدٍ نَّوَيْتُ مِنْ شَهْرِ رَمَضَانَ', translit: 'Wa bisawmi ghadin nawaytu min shahri Ramadan', en: 'And I intend to keep the fast for tomorrow in the month of Ramadan.', bn: 'এবং আমি রমজান মাসের আগামীকালের রোজা রাখার নিয়ত করলাম।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua for Suhoor (Pre-Dawn Meal)', arabic: 'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ', translit: 'Allahumma barik lana fima razaqtana wa qina \'adhaban-nar', en: 'O Allah, bless us in what You have provided us and save us from the punishment of the Fire.', bn: 'হে আল্লাহ, আপনি আমাদের যা রিজিক দিয়েছেন তাতে বরকত দিন এবং জাহান্নামের আজাব থেকে রক্ষা করুন।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua at Iftar (Breaking the Fast)', arabic: 'ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ', translit: 'Dhahaba adh-dhama\'u wabtallatil-\'uruqu wa thabatal-ajru in sha Allah', en: 'The thirst has gone, the veins are moistened, and the reward is confirmed, if Allah wills.', bn: 'পিপাসা দূর হয়েছে, শিরাগুলো সিক্ত হয়েছে এবং ইনশাআল্লাহ প্রতিদান নিশ্চিত হয়েছে।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua When Seeing the New Moon', arabic: 'اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ وَالسَّلَامَةِ وَالْإِسْلَامِ', translit: 'Allahumma ahillahu \'alayna bil-yumni wal-iman was-salamati wal-islam', en: 'O Allah, let this moon appear on us with security, faith, safety, and Islam.', bn: 'হে আল্লাহ, এই চাঁদ আমাদের উপর নিরাপত্তা, ঈমান, শান্তি ও ইসলামের সাথে উদিত করুন।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua for Laylatul Qadr', arabic: 'اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي', translit: 'Allahumma innaka \'afuwwun tuhibbul-\'afwa fa\'fu \'anni', en: 'O Allah, You are Most Forgiving, and You love forgiveness; so forgive me.', bn: 'হে আল্লাহ, আপনি ক্ষমাশীল, ক্ষমা করতে ভালোবাসেন, তাই আমাকে ক্ষমা করুন।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua for Breaking Fast at Someone\'s Home', arabic: 'أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ وَصَلَّتْ عَلَيْكُمُ الْمَلَائِكَةُ', translit: 'Aftara \'indakumus-sa\'imuna wa akala ta\'amakumul-abraru wa sallat \'alaykumul-mala\'ikah', en: 'May the fasting break their fast in your home, and may the righteous eat your food, and may the angels send blessings upon you.', bn: 'আপনার ঘরে রোজাদাররা ইফতার করুক, নেককাররা আপনার খাবার খাক এবং ফেরেশতারা আপনার উপর দোয়া করুক।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua When Someone Insults You While Fasting', arabic: 'إِنِّي صَائِمٌ إِنِّي صَائِمٌ', translit: 'Inni sa\'imun, inni sa\'imun', en: 'I am fasting, I am fasting.', bn: 'আমি রোজাদার, আমি রোজাদার।' },
        { category: '🌙 Ramadan & Fasting', title: 'Dua for Forgiveness in Ramadan', arabic: 'رَبَّنَا اغْفِرْ لَنَا وَلِوَالِدَيْنَا وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا', translit: 'Rabbanaghfir lana wa liwalidayna warhamhuma kama rabbayani saghira', en: 'Our Lord, forgive us and our parents, and have mercy on them as they raised me when I was small.', bn: 'হে আমাদের রব, আমাদের এবং আমাদের পিতা-মাতাকে ক্ষমা করুন এবং তাদের প্রতি দয়া করুন যেমন তারা আমাকে ছোটবেলায় লালন-পালন করেছেন।' },

        { category: '😴 Sleep & Waking', title: 'Before Sleeping', arabic: 'بِاسْمِكَ ٱللَّٰهُمَّ أَمُوتُ وَأَحْيَا', translit: 'Bismika Allahumma amootu wa ahya', en: 'In Your name, O Allah, I die and I live.', bn: 'হে আল্লাহ, আপনার নামেই আমি মরি ও বাঁচি।' },
        { category: '😴 Sleep & Waking', title: 'Upon Waking Up', arabic: 'ٱلْحَمْدُ لِلَّٰهِ ٱلَّذِى أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ ٱلنُّشُورُ', translit: 'Alhamdulillahi alladhi ahyana ba\'da ma amatana wa ilayhin-nushur', en: 'All praise is for Allah who gave us life after death, and to Him is the resurrection.', bn: 'সকল প্রশংসা আল্লাহর, যিনি মৃত্যুর পর আমাদের জীবন দান করেছেন এবং তাঁর কাছেই ফিরে যেতে হবে।' },
        {
          category: '😴 Sleep & Waking',
          title: 'Ayatul Kursi (Full)',
          arabic: 'ٱللَّٰهُ لَا إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ',
          translit: 'Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta\'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa\'u \'indahu illa bi-idhnih. Ya\'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay\'in min \'ilmihi illa bima sha\'. Wasi\'a kursiyyuhus-samawati wal-ard. Wa la ya\'uduhu hifzuhuma. Wa Huwal-\'Aliyyul-\'Azim.',
          en: 'Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is before them and what will be after them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great.',
          bn: 'আল্লাহ, তিনি ছাড়া কোনো উপাস্য নেই। তিনি চিরঞ্জীব, সবকিছুর ধারক। তাঁকে তন্দ্রা ও নিদ্রা স্পর্শ করে না। আসমান ও জমিনে যা কিছু আছে সবই তাঁর। কে আছে যে তাঁর অনুমতি ছাড়া তাঁর কাছে সুপারিশ করবে? তিনি জানেন তাদের সামনে ও পিছনে যা কিছু আছে। তারা তাঁর জ্ঞানের কিছুই আয়ত্ত করতে পারে না, তবে তিনি যতটুকু চান। তাঁর কুরসি আসমান ও জমিন পরিব্যাপ্ত করে আছে, আর তা রক্ষণাবেক্ষণ তাঁর জন্য কষ্টকর নয়। তিনিই সুউচ্চ, মহান।'
        },

        { category: '🍽️ Eating & Drinking', title: 'After Eating', arabic: 'ٱلْحَمْدُ لِلَّٰهِ ٱلَّذِى أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ', translit: 'Alhamdulillahi alladhi at\'amana wa saqana wa ja\'alana muslimin', en: 'All praise is for Allah who fed us, gave us drink, and made us Muslims.', bn: 'সকল প্রশংসা আল্লাহর, যিনি আমাদের খাওয়ালেন, পান করালেন এবং মুসলিম বানালেন।' },

        { category: '🕌 Wudu & Prayer', title: 'After Wudu', arabic: 'أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا ٱللَّٰهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ', translit: 'Ash-hadu an la ilaha illallah wa ash-hadu anna Muhammadan \'abduhu wa rasuluh', en: 'I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and messenger.', bn: 'আমি সাক্ষ্য দিচ্ছি যে, আল্লাহ ছাড়া কোনো উপাস্য নেই এবং মুহাম্মদ (সা.) তাঁর বান্দা ও রাসূল।' },

        { category: '🏠 Home & Travel', title: 'Leaving Home', arabic: 'بِسْمِ ٱللَّٰهِ تَوَكَّلْتُ عَلَى ٱللَّٰهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّٰهِ', translit: 'Bismillahi tawakkaltu \'alallah, wa la hawla wa la quwwata illa billah', en: 'In the name of Allah, I place my trust in Allah. There is no might nor power except with Allah.', bn: 'আল্লাহর নামে, আল্লাহর উপরই ভরসা করলাম। আল্লাহর সাহায্য ছাড়া কোনো শক্তি ও ক্ষমতা নেই।' },
        { category: '🏠 Home & Travel', title: 'Travel Dua', arabic: 'سُبْحَٰنَ ٱلَّذِى سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُۥ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ', translit: 'Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun', en: 'Glory to Him who has subjected this to us, and to our Lord we shall surely return.', bn: 'পবিত্র সেই সত্তা, যিনি এটিকে আমাদের অধীন করে দিয়েছেন, নিশ্চয়ই আমরা আমাদের রবের কাছে ফিরে যাব।' },

        { category: '🛡️ Distress & Protection', title: 'When in Difficulty', arabic: 'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ ٱلْعَظِيمُ ٱلْحَلِيمُ', translit: 'La ilaha illallahul-\'Azimul-Halim', en: 'There is no god but Allah, the Mighty, the Forbearing.', bn: 'আল্লাহ ছাড়া কোনো উপাস্য নেই, তিনি মহান ও সহনশীল।' },

      const speechSupported = 'speechSynthesis' in window;
      let cachedVoices = [];

      function refreshVoices() {
        if (!speechSupported) return;
        try { cachedVoices = speechSynthesis.getVoices() || []; }
        catch (e) { cachedVoices = []; }
      }

      if (speechSupported) {
        refreshVoices();
        speechSynthesis.onvoiceschanged = refreshVoices;
        setTimeout(refreshVoices, 250);
        setTimeout(refreshVoices, 1000);
      }

      function pickVoice(lang) {
        if (!speechSupported) return null;
        if (!cachedVoices.length) refreshVoices();
        if (!cachedVoices.length) return null;
        const lower = lang.toLowerCase();
        const prefix = lower.split('-')[0];
        let v = cachedVoices.find(x => x.lang && x.lang.toLowerCase() === lower);
        if (v) return v;
        v = cachedVoices.find(x => x.lang && x.lang.toLowerCase().startsWith(prefix + '-'));
        if (v) return v;
        v = cachedVoices.find(x => x.lang && x.lang.toLowerCase().startsWith(prefix));
        if (v) return v;
        return null;
      }

      function speakOne(text, lang, rate = 0.85) {
        return new Promise((resolve) => {
          if (!speechSupported || !text) { resolve(); return; }
          const utter = new SpeechSynthesisUtterance(text);
          const voice = pickVoice(lang);
          if (voice) utter.voice = voice;
          utter.lang = lang;
          utter.rate = rate;
          utter.pitch = 1;
          utter.volume = 1;
          let done = false;
          const finish = () => { if (!done) { done = true; resolve(); } };
          utter.onend = finish;
          utter.onerror = finish;
          const estMs = Math.max(2000, Math.min(60000, text.length * 100));
          setTimeout(finish, estMs);
          try { speechSynthesis.speak(utter); } catch (e) { finish(); }
        });
      }

      function stopSpeech() {
        if (speechSupported) {
          try { speechSynthesis.cancel(); } catch (e) {}
        }
        isSpeaking = false;
        speechQueue = [];
        if (currentSpeakingBtn) {
          currentSpeakingBtn.classList.remove('playing');
          currentSpeakingBtn = null;

        if (stopListenBtn) stopListenBtn.style.display = 'none';
        if (listenAllBtn) listenAllBtn.style.display = '';

          currentSpeakingBtn = btn;
        } else {

      function ensureAudioContext() {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
          catch (e) { return null; }
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playClickSound() {
        if (!soundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1800, now);
        osc1.frequency.exponentialRampToValueAtTime(900, now + 0.05);
        gain1.gain.setValueAtTime(0.0001, now);
        gain1.gain.exponentialRampToValueAtTime(0.18, now + 0.005);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
        osc1.connect(gain1); gain1.connect(ctx.destination);
        osc1.start(now); osc1.stop(now + 0.07);
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(420, now);
        osc2.frequency.exponentialRampToValueAtTime(180, now + 0.06);
        gain2.gain.setValueAtTime(0.0001, now);
        gain2.gain.exponentialRampToValueAtTime(0.12, now + 0.008);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.start(now); osc2.stop(now + 0.1);
      }

      function playTargetSound() {
        if (!soundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.0001, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.15, now + i * 0.08 + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.4);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.5);
        });
      }

      function uid() { return 'dhikr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
      function sanitizeTarget(raw) {
        let n = parseInt(raw, 10);
        if (isNaN(n) || n < 1) return 1;
        if (n > MAX_COUNT) return MAX_COUNT;
        return n;
      }

      function loadAll() {
        try {
          const rawDhikrs = localStorage.getItem(KEYS.DHIKRS);
          const rawActive = localStorage.getItem(KEYS.ACTIVE);
          const rawHistory = localStorage.getItem(KEYS.HISTORY);

          if (rawDhikrs) {
            const parsed = JSON.parse(rawDhikrs);
            if (Array.isArray(parsed) && parsed.length > 0) {
              dhikrs = parsed.filter(d => d && d.id && typeof d.count === 'number');
              dhikrs.forEach(d => {
                d.target = sanitizeTarget(d.target);
                if (d.count > MAX_COUNT) d.count = MAX_COUNT;
                if (d.count < 0) d.count = 0;
                if (typeof d.translationBn !== 'string') d.translationBn = '';
              });
            }
          }
          if (!dhikrs.length) {
            const olderVersions = ['tasbeeh_dhikrs_v15', 'tasbeeh_dhikrs_v14'];
            for (const key of olderVersions) {
              const raw = localStorage.getItem(key);
              if (raw) {
                try {
                  const parsed = JSON.parse(raw);
                  if (Array.isArray(parsed) && parsed.length > 0) {
                    dhikrs = parsed.filter(d => d && d.id && typeof d.count === 'number');
                    dhikrs.forEach(d => {
                      d.target = sanitizeTarget(d.target);
                      if (typeof d.translationBn !== 'string') d.translationBn = '';
                    });
                    if (!dhikrs.some(d => d.id === 'rabbizidni')) {
                      dhikrs.push(JSON.parse(JSON.stringify(DEFAULT_DHIKRS[7])));
                    }
                    break;
                  }
                } catch (e) {}
              }
            }
            if (!dhikrs.length) dhikrs = JSON.parse(JSON.stringify(DEFAULT_DHIKRS));
          }

          if (rawActive && dhikrs.some(d => d.id === rawActive)) activeId = rawActive;
          else activeId = dhikrs[0].id;

          if (rawHistory) {
            const parsed = JSON.parse(rawHistory);
            if (Array.isArray(parsed)) {
              history = parsed.filter(h =>
                h && typeof h.count === 'number' &&
                typeof h.timestamp === 'number' &&
                typeof h.dhikrId === 'string'
              ).slice(0, MAX_HISTORY);
            }
          }
        } catch (e) {
          dhikrs = JSON.parse(JSON.stringify(DEFAULT_DHIKRS));
          activeId = dhikrs[0].id;
        }
      }

      let heartInterval = null;

      function spawnFloatingHeart() {
        const heart = document.createElement('div');

        const anims = ['floatHeart1', 'floatHeart2', 'floatHeart3', 'floatHeart4', 'floatHeart5'];

        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        heart.style.fontSize = (1.4 + Math.random() * 1.6) + 'rem';

        }, duration * 1000 + 200);

      }

      function startHeartRain() {
        stopHeartRain();
        for (let i = 0; i < 14; i++) setTimeout(spawnFloatingHeart, i * 90);
        let count = 0;
        heartInterval = setInterval(() => {
          if (count >= 20) { stopHeartRain(); return; }
          spawnFloatingHeart();
          count++;
        }, 260);
      }

      function stopHeartRain() {
        if (heartInterval) { clearInterval(heartInterval); heartInterval = null; }
        heartTimeouts.forEach(t => clearTimeout(t));

      function updateUI() {

      function switchDhikr(id) {
        if (id === activeId) return;
        activeId = id;
        congratsShownFor = null;
        updateUI();
        saveAll();
      }

      function deleteDhikr(id) {
        if (dhikrs.length <= 1) { alert('You need at least one dhikr.'); return; }
        const d = dhikrs.find(x => x.id === id);
        if (!d) return;
        if (!confirm(`Delete "${d.name}" and its saved count (${d.count})?`)) return;
        dhikrs = dhikrs.filter(x => x.id !== id);
        history = history.filter(h => h.dhikrId !== id);
        saveHistory();
        if (activeId === id) activeId = dhikrs[0].id;
        saveAll();
        updateUI();
        renderDropdown();
      }

      function increment() {
        const d = getActive();
        if (!d) return;
        if (d.count < MAX_COUNT) d.count++;
        const wasBelowTarget = (d.count - 1) < d.target;
        const nowAtTarget = d.count >= d.target;
        updateUI(); pulseDisplay(); saveDebounced(); playClickSound();
        if (navigator.vibrate) navigator.vibrate(10);
        if (wasBelowTarget && nowAtTarget && d.target > 0) {
          if (!congratsShownFor || congratsShownFor.dhikrId !== d.id || congratsShownFor.target !== d.target) {
            congratsShownFor = { dhikrId: d.id, target: d.target };
            showCongratulations(d);
          }
        }
      }

      function decrement() {
        const d = getActive();
        if (!d) return;
        if (d.count > 0) {
          d.count--;
          if (d.count < d.target) congratsShownFor = null;
          updateUI();
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 100);
          saveDebounced(); playClickSound();
        } else {
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 100);
        }
      }

      function resetCounter() {
        const d = getActive();
        if (!d) return;
        if (d.count === 0) {
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 200);
          return;
        }
        upsertHistoryEntry(d);
        d.count = 0;
        congratsShownFor = null;
        updateUI();
        countDisplay.classList.add('pulse');
        setTimeout(() => countDisplay.classList.remove('pulse'), 200);
        saveAll();
        if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
      }

      function pulseDisplay() {
        countDisplay.classList.add('pulse');
        setTimeout(() => countDisplay.classList.remove('pulse'), 150);
      }

      function applyTargetFromInput() {
        const d = getActive();
        if (!d) return;
        d.target = sanitizeTarget(targetInput.value);
        targetInput.value = d.target;
        if (congratsShownFor && congratsShownFor.target !== d.target) congratsShownFor = null;
        updateUI();
        saveAll();
      }

      function upsertHistoryEntry(dhikr) {
        if (!dhikr || dhikr.count <= 0) return;
        history = history.filter(h => h.dhikrId !== dhikr.id);
        history.unshift({ dhikrId: dhikr.id, name: dhikr.name, count: dhikr.count, timestamp: Date.now() });
        if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
        saveHistory();
      }

      function renderHistory() {
        historyList.innerHTML = '';
        if (!history.length) {
          const e = document.createElement('div');
          e.className = 'empty-history';
          e.textContent = 'No saved sessions yet. Tap 💾 Save to store a session.';
          historyList.appendChild(e);
          return;
        }
        const hint = document.createElement('div');
        hint.className = 'history-hint';
        hint.textContent = '👆 Tap a session to restore its count';
        historyList.appendChild(hint);
        history.forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';
          const info = document.createElement('div');
          info.className = 'h-info';
          const name = document.createElement('span');
          name.className = 'h-name';
          name.textContent = item.name;
          const time = document.createElement('span');
          time.className = 'h-time';
          time.textContent = formatTime(item.timestamp);
          info.appendChild(name); info.appendChild(time);
          const countEl = document.createElement('span');
          countEl.className = 'h-count';
          countEl.textContent = item.count;
          div.appendChild(info); div.appendChild(countEl);
          div.addEventListener('click', () => restoreHistoryEntry(item));
          historyList.appendChild(div);
        });
      }

      function restoreHistoryEntry(item) {
        const d = dhikrs.find(x => x.id === item.dhikrId);
        if (!d) { showToast('Dhikr no longer exists'); return; }
        if (activeId !== d.id) activeId = d.id;
        d.count = Math.min(item.count, MAX_COUNT);
        congratsShownFor = null;
        updateUI(); saveAll(); closeHistory();
        showToast(`Restored: ${d.name} → ${d.count}`);
        if (navigator.vibrate) navigator.vibrate(20);
      }

      function formatTime(ts) {
        const d = new Date(ts);
        const now = new Date();
        if (d.toDateString() === now.toDateString()) {
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }

      function closeHistory() { historyModal.classList.remove('show'); }
      function clearHistory() {

      function showDuaDetail(index) {
        if (!currentCategoryDuas.length) return;
        if (index < 0) index = 0;
        if (index >= currentCategoryDuas.length) index = currentCategoryDuas.length - 1;
        currentDuaInCategory = index;

        const dua = currentCategoryDuas[index];

        duaDetailTitle.textContent = dua.title;
        duaDetailArabic.textContent = dua.arabic;
        duaDetailEn.textContent = dua.en;
        duaDetailBn.textContent = dua.bn;

        duaProgressText.textContent = `Dua ${index + 1} of ${currentCategoryDuas.length}`;
        duaProgressDots.innerHTML = '';
        for (let i = 0; i < currentCategoryDuas.length; i++) {
          const dot = document.createElement('div');
          dot.className = 'dua-progress-dot';
          if (i === index) dot.classList.add('active');
          else if (i < index) dot.classList.add('visited');
          duaProgressDots.appendChild(dot);
        }

        prevDuaBtn.disabled = (index === 0);
        nextDuaBtn.disabled = (index === currentCategoryDuas.length - 1);
        nextDuaBtn.textContent = (index === currentCategoryDuas.length - 1) ? 'End ✓' : 'Next →';
        nextDuaBtn.classList.toggle('primary', index !== currentCategoryDuas.length - 1);

        duasCategoriesView.hidden = true;
        duasInCategoryView.hidden = true;
        duaDetailView.hidden = false;

        stopSpeech();
        const body = duaDetailView.querySelector('.dua-detail-body');
        if (body) body.scrollTop = 0;
      }

      function renderCategoriesList(filter) {
        duasCategoriesContainer.innerHTML = '';
        const term = (filter || '').toLowerCase().trim();

        if (term) {
          const filtered = DAILY_DUAS
            .map((dua, originalIndex) => ({ dua, originalIndex }))
            .filter(({ dua }) =>
              dua.title.toLowerCase().includes(term) ||
              dua.translit.toLowerCase().includes(term) ||
              dua.en.toLowerCase().includes(term) ||
              dua.bn.includes(term) ||
              dua.category.toLowerCase().includes(term)
            );

          if (!filtered.length) {
            const empty = document.createElement('div');
            empty.className = 'empty-duas';
            empty.textContent = '🤲 No duas found. Try a different search.';
            duasCategoriesContainer.appendChild(empty);
            return;
          }

          filtered.forEach(({ dua, originalIndex }) => {
            const item = document.createElement('div');
            item.className = 'dua-item';
            const info = document.createElement('div');
            info.className = 'dua-item-info';
            const t = document.createElement('div');
            t.className = 'dua-item-title';
            t.textContent = dua.title;
            const s = document.createElement('div');
            s.className = 'dua-item-subtitle';
            s.textContent = dua.category + ' · ' + dua.translit;
            info.appendChild(t); info.appendChild(s);
            const arrow = document.createElement('span');
            arrow.className = 'dua-item-arrow';
            arrow.textContent = '›';
            item.appendChild(info); item.appendChild(arrow);
            item.addEventListener('click', () => {
              currentCategory = dua.category;
              const groups = groupDuasByCategory();
              currentCategoryDuas = groups[dua.category] || [];
              const localIdx = currentCategoryDuas.findIndex(d => d.originalIndex === originalIndex);
              showDuaDetail(localIdx >= 0 ? localIdx : 0);
            });
            duasCategoriesContainer.appendChild(item);
          });
          return;
        }

        const groups = groupDuasByCategory();
        Object.keys(groups).forEach(category => {
          const card = document.createElement('div');
          card.className = 'dua-category-card';

          const info = document.createElement('div');
          info.className = 'dua-category-card-info';

          const nameEl = document.createElement('div');
          nameEl.className = 'dua-category-card-name';
          nameEl.textContent = category;

          const countEl = document.createElement('div');
          countEl.className = 'dua-category-card-count';
          countEl.textContent = `${groups[category].length} dua${groups[category].length > 1 ? 's' : ''}`;

          info.appendChild(nameEl);
          info.appendChild(countEl);

          const badge = document.createElement('div');
          badge.className = 'dua-category-card-badge';
          badge.textContent = '›';

          card.appendChild(info);
          card.appendChild(badge);
          card.addEventListener('click', () => showCategoryDuasView(category));
          duasCategoriesContainer.appendChild(card);
        });
      }

      function openAddDhikr() {
        editingDhikrId = null;
        dhikrModalTitle.textContent = '➕ Add New Dhikr';
        dhikrNameInput.value = '';
        dhikrArabicInput.value = '';
        dhikrTranslationInput.value = '';
        dhikrTranslationBnInput.value = '';
        dhikrTargetInput.value = 33;
        dhikrModal.classList.add('show');
        setTimeout(() => dhikrNameInput.focus(), 100);
      }

      function openEditDhikr(id) {
        const d = dhikrs.find(x => x.id === id);
        if (!d) return;
        editingDhikrId = id;
        dhikrModalTitle.textContent = '✏️ Edit Dhikr';
        dhikrNameInput.value = d.name;
        dhikrArabicInput.value = d.arabic || '';
        dhikrTranslationInput.value = d.translation || '';
        dhikrTranslationBnInput.value = d.translationBn || '';
        dhikrTargetInput.value = d.target;
        dhikrModal.classList.add('show');
      }

      function closeDhikrModal() {
        dhikrModal.classList.remove('show');
        editingDhikrId = null;
      }

      function saveDhikrFromModal() {
        const name = dhikrNameInput.value.trim();
        if (!name) { alert('Please enter a name for the dhikr.'); dhikrNameInput.focus(); return; }
        const arabic = dhikrArabicInput.value.trim();
        const translation = dhikrTranslationInput.value.trim();
        const translationBn = dhikrTranslationBnInput.value.trim();
        const targetVal = sanitizeTarget(dhikrTargetInput.value);
        if (editingDhikrId) {
          const d = dhikrs.find(x => x.id === editingDhikrId);
          if (d) {
            d.name = name; d.arabic = arabic; d.translation = translation;
            d.translationBn = translationBn; d.target = targetVal;
            const h = history.find(x => x.dhikrId === d.id);
            if (h) { h.name = name; saveHistory(); }
          }
        } else {
          const newDhikr = { id: uid(), name, arabic, translation, translationBn, count: 0, target: targetVal };
          dhikrs.push(newDhikr);
          activeId = newDhikr.id;
        }
        congratsShownFor = null;
        saveAll();
        updateUI();
        closeDhikrModal();
      }

      dhikrSelectDisplay.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        toggleDropdown();
      });
      dhikrSelectDisplay.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
      dhikrSelectDisplay.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });

      dhikrDropdown.addEventListener('click', (e) => e.stopPropagation());
      dhikrDropdown.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

      countWrap.addEventListener('click', (e) => {
        e.stopPropagation();
        increment();
      });

      incrementBtn.addEventListener('click', increment);
      decrementBtn.addEventListener('click', decrement);
      resetBtn.addEventListener('click', resetCounter);

      document.addEventListener('click', (e) => {
        if (!dhikrSelectDisplay.contains(e.target) && !dhikrDropdown.contains(e.target)) {
          closeDropdown();
        }
      });

      saveSessionBtn.addEventListener('click', () => {
        const d = getActive();
        if (!d || d.count <= 0) { showToast('Nothing to save yet'); return; }
        upsertHistoryEntry(d);
        showSaveIndicator();
        showToast(`Saved: ${d.name} → ${d.count}`);
        if (navigator.vibrate) navigator.vibrate(15);
      });

      if (soundToggleBtn) soundToggleBtn.addEventListener('click', toggleSound);

      duasBtn.addEventListener('click', openDuas);
      closeDuasBtn.addEventListener('click', closeDuas);
      duasModal.addEventListener('click', (e) => { if (e.target === duasModal) closeDuas(); });

      duasSearchInput.addEventListener('input', (e) => renderCategoriesList(e.target.value));

      backToCategoriesBtn.addEventListener('click', () => {
        duasSearchInput.value = '';
        renderCategoriesList('');
        showCategoriesView();
      });

      duaBackBtn.addEventListener('click', () => {
        showCategoryDuasView(currentCategory);
      });

      prevDuaBtn.addEventListener('click', () => {
        if (currentDuaInCategory > 0) showDuaDetail(currentDuaInCategory - 1);
      });
      nextDuaBtn.addEventListener('click', () => {
        if (currentDuaInCategory < currentCategoryDuas.length - 1) {
          showDuaDetail(currentDuaInCategory + 1);
        } else {
          showCategoryDuasView(currentCategory);
        }
      });

      document.querySelectorAll('.dua-listen-small').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.listen;
          const dua = currentCategoryDuas[currentDuaInCategory];
          if (!dua) return;
          if (target === 'en') {
            speakSection(dua.en, 'en-US', btn);
          }
        });
      });

      if (listenAllBtn) {
        listenAllBtn.addEventListener('click', () => {
          const dua = currentCategoryDuas[currentDuaInCategory];
          if (!dua) return;
          speakAll(dua, listenAllBtn);
        });
      }
      if (stopListenBtn) {
        stopListenBtn.addEventListener('click', () => { stopSpeech(); });
      }

      let touchStartX = 0;
      duaDetailView.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      duaDetailView.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(dx) < 60) return;
        if (dx < 0) {
          if (currentDuaInCategory < currentCategoryDuas.length - 1) showDuaDetail(currentDuaInCategory + 1);
        } else {
          if (currentDuaInCategory > 0) showDuaDetail(currentDuaInCategory - 1);
        }
      }, { passive: true });

      targetInput.addEventListener('input', () => {
        const d = getActive();
        if (!d) return;
        let raw = targetInput.value.replace(/\D/g, '');
        if (raw.length > 6) raw = raw.slice(0, 6);
        if (raw === '') { targetInput.value = ''; return; }
        if (raw !== targetInput.value) targetInput.value = raw;
        const parsed = parseInt(raw, 10);
        if (!isNaN(parsed) && parsed >= 1) {
          d.target = Math.min(parsed, MAX_COUNT);
          updateUI(); saveDebounced();
        }
      });
      targetInput.addEventListener('blur', applyTargetFromInput);
      targetInput.addEventListener('change', applyTargetFromInput);
      targetInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); targetInput.blur(); applyTargetFromInput(); }
        e.stopPropagation();
      });

      historyBtn.addEventListener('click', openHistory);
      closeHistoryBtn.addEventListener('click', closeHistory);
      closeHistoryBtn2.addEventListener('click', closeHistory);
      clearHistoryBtn.addEventListener('click', clearHistory);
      historyModal.addEventListener('click', (e) => { if (e.target === historyModal) closeHistory(); });

      closeDhikrBtn.addEventListener('click', closeDhikrModal);
      cancelDhikrBtn.addEventListener('click', closeDhikrModal);
      saveDhikrBtn.addEventListener('click', saveDhikrFromModal);
      dhikrModal.addEventListener('click', (e) => { if (e.target === dhikrModal) closeDhikrModal(); });

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === targetInput) return;
        if (document.activeElement === duasSearchInput) {
          if (e.key === 'Escape') duasSearchInput.blur();
          return;
        }
        if (document.activeElement === dhikrNameInput ||
            document.activeElement === dhikrArabicInput ||
            document.activeElement === dhikrTranslationInput ||
            document.activeElement === dhikrTranslationBnInput ||
            document.activeElement === dhikrTargetInput) return;

        if (duasModal.classList.contains('show')) {
          if (!duaDetailView.hidden) {
            if (e.key === 'ArrowRight') {
              e.preventDefault();
              if (currentDuaInCategory < currentCategoryDuas.length - 1) showDuaDetail(currentDuaInCategory + 1);
            } else if (e.key === 'ArrowLeft') {
              e.preventDefault();
              if (currentDuaInCategory > 0) showDuaDetail(currentDuaInCategory - 1);
            } else if (e.key === 'Escape') {
              e.preventDefault();
              showCategoryDuasView(currentCategory);
            }
          } else if (!duasInCategoryView.hidden) {
            if (e.key === 'Escape') { e.preventDefault(); backToCategoriesBtn.click(); }
          } else {
            if (e.key === 'Escape') closeDuas();
          }
          return;
        }

        if (historyModal.classList.contains('show')) {
          if (e.key === 'Escape') closeHistory();
          return;
        }
        if (dhikrModal.classList.contains('show')) {
          if (e.key === 'Escape') closeDhikrModal();
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveDhikrFromModal();
          return;
        }

        if (e.key === ' ' || e.key === 'Space' || e.key === '+' || e.key === 'ArrowUp' || e.key === 'Enter') {
          e.preventDefault(); increment();
        } else if (e.key === '-' || e.key === 'ArrowDown') {
          e.preventDefault(); decrement();
        } else if (e.key === 'r' || e.key === 'R') {
          e.preventDefault(); resetCounter();
        } else if (e.key === 'h' || e.key === 'H') {
          e.preventDefault(); openHistory();
        } else if (e.key === 'd' || e.key === 'D') {
          e.preventDefault(); openDuas();
        } else if (e.key === 's' || e.key === 'S') {
          e.preventDefault(); saveSessionBtn.click();
        } else if (e.key === 'n' || e.key === 'N') {
          e.preventDefault(); openAddDhikr();
        } else if (e.key === 'm' || e.key === 'M') {
          e.preventDefault(); toggleSound();
        } else if (e.key === 'Escape') {
          closeDropdown();
        }
      });

      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

      window.addEventListener('beforeunload', () => {
        stopSpeech();
        saveAll();
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });

      if (speechSupported) {
        refreshVoices();
        speechSynthesis.onvoiceschanged = refreshVoices;
      }

      loadAll();
      loadSoundPref();
      updateUI();
      renderDropdown();

    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then((reg) => console.log('✓ Service Worker registered:', reg.scope))
          .catch((err) => console.warn('✗ Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>

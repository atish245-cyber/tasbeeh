<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d2b1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasbeeh">
  <title>Tasbeeh — Dhikr Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b2a1e 0%, #1a4a2e 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      margin: 0;
    }

    .tasbeeh-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 20px 16px 24px;
      box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 440px;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .counter-card {
      background: #0d2b1c;
      border-radius: 40px;
      padding: 20px 16px 22px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6), 0 10px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid #3b6e4b;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---------- TOP BAR ---------- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      min-height: 26px;
      gap: 6px;
    }

    .save-indicator {
      font-size: 0.7rem;
      font-weight: 600;
      color: #9fdf9f;
      background: rgba(31, 79, 48, 0.9);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #589b6b;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .save-indicator.show { opacity: 1; }

    .save-indicator .dot {
      width: 6px; height: 6px;
      background: #d4ffb0;
      border-radius: 50%;
      box-shadow: 0 0 6px #d4ffb0;
    }

    .top-btn {
      background: rgba(31, 79, 48, 0.6);
      border: 1px solid #589b6b;
      color: #c6e6b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .top-btn:active { transform: scale(0.95); background: rgba(59, 139, 75, 0.8); }

    /* ---------- DHIKR SELECTOR ---------- */
    .dhikr-selector {
      position: relative;
      margin-bottom: 8px;
    }

    .dhikr-select-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #12331f;
      border: 1px solid #3f6b4b;
      border-radius: 40px;
      padding: 10px 16px;
      cursor: pointer;
      transition: all 0.15s;
      gap: 8px;
    }

    .dhikr-select-display:active {
      background: #1a4429;
      transform: scale(0.99);
    }

    .dhikr-selected-text {
      flex: 1;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 600;
      color: #e9f7d6;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dhikr-select-arrow {
      color: #9fdf9f;
      font-size: 0.8rem;
      transition: transform 0.2s;
    }

    .dhikr-select-display.open .dhikr-select-arrow {
      transform: rotate(180deg);
    }

    /* ---------- DHIKR DROPDOWN ---------- */
    .dhikr-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0f2e1d;
      border: 1px solid #3f6b4b;
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9);
      z-index: 20;
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dhikr-dropdown.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dhikr-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-option:hover { background: #1a4429; }
    .dhikr-option:active { background: #22633a; }

    .dhikr-option.active {
      background: #2e7a48;
      box-shadow: inset 0 0 0 1px #8fd49c;
    }

    .dhikr-option-info {
      flex: 1;
      min-width: 0;
    }

    .dhikr-option-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e9f7d6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dhikr-option-arabic {
      font-size: 0.75rem;
      color: #8fb898;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Traditional Arabic', 'Scheherazade', serif;
      direction: rtl;
      text-align: right;
    }

    .dhikr-option-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .dhikr-option-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: #d4ffb0;
      font-variant-numeric: tabular-nums;
    }

    .dhikr-option-target {
      font-size: 0.65rem;
      color: #7fa588;
    }

    .dhikr-option-delete {
      background: transparent;
      border: none;
      color: #d47a5a;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      opacity: 0.6;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-option-delete:hover { opacity: 1; background: rgba(94, 58, 30, 0.5); }

    .dhikr-divider {
      height: 1px;
      background: #2d5a3b;
      margin: 4px 8px;
    }

    .dhikr-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(46, 122, 72, 0.4);
      border: 1px dashed #589b6b;
      color: #9fdf9f;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .dhikr-add-btn:hover { background: rgba(46, 122, 72, 0.7); }
    .dhikr-add-btn:active { transform: scale(0.98); }

    /* ---------- COUNT ---------- */
    .count-display {
      font-size: clamp(4rem, 18vw, 6.5rem);
      font-weight: 800;
      text-align: center;
      color: #e9f7d6;
      text-shadow: 0 0 12px #a3e0a0, 0 8px 0 #0a1f12;
      letter-spacing: 2px;
      line-height: 1;
      margin: 2px 0 8px;
      word-break: break-word;
      transition: transform 0.1s ease;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .count-display.pulse {
      transform: scale(1.06);
      text-shadow: 0 0 22px #d4ffb0, 0 8px 0 #0a1f12;
    }

    /* ---------- TARGET ROW ---------- */
    .target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f2e1d;
      padding: 8px 12px;
      border-radius: 60px;
      margin: 8px 0 16px;
      box-shadow: inset 0 2px 6px #00000055, 0 2px 4px #00000033;
      border: 1px solid #2d5a3b;
      gap: 6px;
    }

    .target-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #b6d7b0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .target-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    /* Wider input to accommodate up to 6 digits */
    .target-input {
      width: 140px;
      max-width: 100%;
      padding: 6px 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #dcf5c0;
      background: #1f4f30;
      border: 1px solid #6fa87f;
      border-radius: 40px;
      text-align: center;
      outline: none;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 2px 4px #00000033;
      font-variant-numeric: tabular-nums;
      transition: all 0.15s;
      -webkit-appearance: none;
      -moz-appearance: textfield;
      letter-spacing: 0.5px;
    }

    .target-input:focus {
      background: #2b6e40;
      border-color: #bbf0bb;
      box-shadow: inset 0 1px 4px #a5d6a5, 0 0 0 3px rgba(187, 240, 187, 0.25);
    }

    .target-input::-webkit-outer-spin-button,
    .target-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .target-input[type=number] { -moz-appearance: textfield; }

    /* ---------- PROGRESS ---------- */
    .progress-ring {
      display: flex;
      justify-content: center;
      margin: 6px 0 14px;
    }

    .ring-track {
      width: 100%;
      height: 10px;
      background: #0b1e13;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px #000000aa;
    }

    .ring-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9fdf9f, #d2f0b0);
      border-radius: 20px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 8px #bbf0bb;
    }

    /* ---------- BUTTONS ---------- */
    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 6px;
    }

    .btn {
      flex: 1 1 0;
      min-width: 100px;
      padding: 18px 8px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 60px;
      background: #1f4a2d;
      color: #f0ffe0;
      box-shadow: 0 8px 0 #0b1f11, 0 6px 12px #00000055;
      transition: all 0.06s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #589b6b;
      text-shadow: 0 2px 0 #0b1f11;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #0b1f11, 0 6px 12px #00000055;
    }

    .btn-primary {
      background: #2e7a48;
      box-shadow: 0 8px 0 #164a26, 0 6px 12px #00000055;
      border-color: #8fd49c;
      font-size: 1.5rem;
    }

    .btn-secondary { background: #1f4a2d; font-size: 1.05rem; }

    .btn-warning {
      background: #5e3a1e;
      border-color: #bb8f5a;
      box-shadow: 0 8px 0 #33200e, 0 6px 12px #00000055;
      color: #ffe6c7;
      font-size: 1.05rem;
    }

    .btn-icon { font-size: 1.4rem; filter: drop-shadow(0 2px 2px black); }

    /* ---------- FOOTER ---------- */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      color: #94b89c;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0 4px;
      gap: 8px;
    }

    .dhikr-translation {
      font-weight: 500;
      color: #8fb898;
      background: #12331f;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      border: 1px solid #3f6b4b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: center;
    }

    /* ---------- MODALS ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    .modal {
      background: #0d2b1c;
      border: 1px solid #3b6e4b;
      border-radius: 32px;
      padding: 22px 20px;
      width: 100%;
      max-width: 380px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.show .modal { transform: translateY(0); }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #dcf5c0;
      letter-spacing: 0.5px;
    }

    .modal-close {
      background: transparent;
      border: 1px solid #589b6b;
      color: #c6e6b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .modal-close:active { background: #2b6e40; }

    .modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
      min-height: 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #b6d7b0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.92rem;
      color: #e9f7d6;
      background: #12331f;
      border: 1px solid #3f6b4b;
      border-radius: 14px;
      outline: none;
      transition: all 0.15s;
      font-family: inherit;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: #8fd49c;
      box-shadow: 0 0 0 3px rgba(143, 212, 156, 0.2);
    }

    .form-textarea {
      resize: none;
      min-height: 60px;
      direction: rtl;
      text-align: right;
      font-size: 1.15rem;
      line-height: 1.5;
      font-family: 'Traditional Arabic', 'Scheherazade', 'Amiri', serif;
    }

    .form-textarea.ltr {
      direction: ltr;
      text-align: left;
      font-size: 0.92rem;
      font-family: inherit;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12331f;
      border: 1px solid #2d5a3b;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #c6e6b8;
      gap: 10px;
    }

    .history-item .h-name {
      font-weight: 600;
      color: #e9f7d6;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item .h-count {
      font-weight: 700;
      color: #9fdf9f;
      font-variant-numeric: tabular-nums;
      font-size: 1rem;
    }

    .history-item .h-time {
      font-size: 0.65rem;
      color: #7fa588;
      white-space: nowrap;
    }

    .empty-history {
      text-align: center;
      color: #7fa588;
      padding: 30px 10px;
      font-style: italic;
      font-size: 0.9rem;
    }

    .modal-footer {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #589b6b;
      background: #1f4a2d;
      color: #f0ffe0;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.1s;
    }

    .modal-btn:active { transform: scale(0.97); }

    .modal-btn.primary { background: #2e7a48; border-color: #8fd49c; }

    .modal-btn.danger {
      background: #5e3a1e;
      border-color: #bb8f5a;
      color: #ffe6c7;
    }

    /* Scrollbar */
    .modal-body::-webkit-scrollbar,
    .dhikr-dropdown::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track,
    .dhikr-dropdown::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb,
    .dhikr-dropdown::-webkit-scrollbar-thumb { background: #2d5a3b; border-radius: 3px; }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 420px) {
      .tasbeeh-container { padding: 14px 10px 18px; border-radius: 36px; }
      .counter-card { padding: 16px 12px 20px; }
      .btn { padding: 15px 6px; font-size: 1.05rem; min-width: 85px; }
      .btn-primary { font-size: 1.3rem; }
      .target-label { font-size: 0.8rem; }
      .target-input { width: 120px; font-size: 1.05rem; padding: 6px 8px; }
      .dhikr-selected-text { font-size: 0.85rem; }
      .dhikr-translation { font-size: 0.65rem; padding: 3px 8px; }
    }

    @media (max-width: 340px) {
      .target-input { width: 105px; font-size: 0.95rem; }
      .target-label { font-size: 0.72rem; }
    }

    @media (max-height: 700px) {
      .count-display { font-size: clamp(3.5rem, 16vw, 5.5rem); margin: 0 0 6px; }
      .target-row { margin: 6px 0 12px; padding: 6px 12px; }
      .progress-ring { margin: 4px 0 10px; }
      .button-grid { margin: 10px 0 4px; }
      .btn { padding: 14px 6px; }
      .footer-row { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="tasbeeh-container">
    <div class="counter-card">
      <!-- Top bar -->
      <div class="top-bar">
        <button id="historyBtn" class="top-btn" title="View session history">📜 History</button>
        <div id="saveIndicator" class="save-indicator">
          <span class="dot"></span> SAVED
        </div>
      </div>

      <!-- Dhikr Selector -->
      <div class="dhikr-selector">
        <div id="dhikrSelectDisplay" class="dhikr-select-display">
          <span id="dhikrSelectedText" class="dhikr-selected-text">Subhanallah</span>
          <span class="dhikr-select-arrow">▼</span>
        </div>
        <div id="dhikrDropdown" class="dhikr-dropdown">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- Main count display -->
      <div id="countDisplay" class="count-display">0</div>

      <!-- Target row (supports up to 6 digits) -->
      <div class="target-row">
        <span class="target-label">🎯 Target</span>
        <div class="target-input-wrap">
          <input id="targetInput" class="target-input" type="number" min="1" max="999999" step="1" value="33" inputmode="numeric" aria-label="Target count" />
        </div>
      </div>

      <!-- Progress bar -->
      <div class="progress-ring">
        <div class="ring-track">
          <div id="progressFill" class="ring-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="button-grid">
        <button id="incrementBtn" class="btn btn-primary" title="Count (tap or press space)">
          <span class="btn-icon">📿</span> +1
        </button>
        <button id="decrementBtn" class="btn btn-secondary" title="Decrease count">
          <span class="btn-icon">−</span> -1
        </button>
      </div>

      <div class="button-grid" style="margin-top: 6px;">
        <button id="saveSessionBtn" class="btn btn-secondary" title="Save this session">
          <span class="btn-icon">💾</span> Save
        </button>
        <button id="resetBtn" class="btn btn-warning" title="Reset this dhikr's counter">
          <span class="btn-icon">↺</span> Reset
        </button>
      </div>

      <!-- Footer -->
      <div class="footer-row">
        <span id="dhikrTranslation" class="dhikr-translation">Glory be to Allah</span>
      </div>
    </div>
  </div>

  <!-- ================= HISTORY MODAL ================= -->
  <div id="historyModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">📜 Session History</span>
        <button id="closeHistoryBtn" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div id="historyList" class="modal-body history-list"></div>
      <div class="modal-footer">
        <button id="clearHistoryBtn" class="modal-btn danger">Clear All</button>
        <button id="closeHistoryBtn2" class="modal-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- ================= ADD/EDIT DHIKR MODAL ================= -->
  <div id="dhikrModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span id="dhikrModalTitle" class="modal-title">➕ Add New Dhikr</span>
        <button id="closeDhikrBtn" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="dhikrNameInput">Name (English)</label>
          <input id="dhikrNameInput" class="form-input" type="text" maxlength="40" placeholder="e.g. Subhanallah" />
        </div>
        <div class="form-group">
          <label class="form-label" for="dhikrArabicInput">Arabic Text (optional)</label>
          <textarea id="dhikrArabicInput" class="form-textarea" maxlength="120" placeholder="سُبْحَانَ ٱللَّٰهِ"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="dhikrTranslationInput">Translation (optional)</label>
          <input id="dhikrTranslationInput" class="form-input" type="text" maxlength="80" placeholder="Glory be to Allah" />
        </div>
        <div class="form-group">
          <label class="form-label" for="dhikrTargetInput">Default Target (up to 6 digits)</label>
          <input id="dhikrTargetInput" class="form-input" type="number" min="1" max="999999" step="1" value="33" inputmode="numeric" />
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelDhikrBtn" class="modal-btn">Cancel</button>
        <button id="saveDhikrBtn" class="modal-btn primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      'use strict';

      // ========== STORAGE KEYS ==========
      const KEYS = {
        DHIKRS: 'tasbeeh_dhikrs_v3',
        ACTIVE: 'tasbeeh_active_v3',
        HISTORY: 'tasbeeh_history_v3'
      };

      const MAX_COUNT = 999999;   // 6-digit max
      const MAX_HISTORY = 50;

      // ========== DEFAULT DHIKRS ==========
      const DEFAULT_DHIKRS = [
        { id: 'subhanallah',     name: 'Subhanallah',           arabic: 'سُبْحَانَ ٱللَّٰهِ',                  translation: 'Glory be to Allah',                count: 0, target: 33  },
        { id: 'alhamdulillah',   name: 'Alhamdulillah',         arabic: 'ٱلْحَمْدُ لِلَّٰهِ',                  translation: 'All praise is for Allah',          count: 0, target: 33  },
        { id: 'allahuakbar',     name: 'Allahu Akbar',          arabic: 'ٱللَّٰهُ أَكْبَرُ',                  translation: 'Allah is the Greatest',            count: 0, target: 34  },
        { id: 'lailahaillallah', name: 'La ilaha illallah',     arabic: 'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ',        translation: 'There is no god but Allah',        count: 0, target: 100 },
        { id: 'astaghfirullah',  name: 'Astaghfirullah',        arabic: 'أَسْتَغْفِرُ ٱللَّٰهَ',              translation: 'I seek forgiveness from Allah',    count: 0, target: 100 },
        { id: 'salawat',         name: 'Salawat (Durood)',      arabic: 'صَلَّى ٱللَّٰهُ عَلَيْهِ وَسَلَّمَ',  translation: 'Peace be upon him',                count: 0, target: 100 },
        { id: 'lahawla',         name: 'La hawla wa la quwwata', arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّٰهِ', translation: 'No power except with Allah',  count: 0, target: 100 }
      ];

      // ========== STATE ==========
      let dhikrs = [];
      let activeId = null;
      let history = [];

      // ========== DOM ==========
      const $ = id => document.getElementById(id);
      const dhikrSelectDisplay = $('dhikrSelectDisplay');
      const dhikrSelectedText = $('dhikrSelectedText');
      const dhikrDropdown = $('dhikrDropdown');
      const countDisplay = $('countDisplay');
      const targetInput = $('targetInput');
      const progressFill = $('progressFill');
      const incrementBtn = $('incrementBtn');
      const decrementBtn = $('decrementBtn');
      const resetBtn = $('resetBtn');
      const saveSessionBtn = $('saveSessionBtn');
      const saveIndicator = $('saveIndicator');
      const historyBtn = $('historyBtn');
      const dhikrTranslation = $('dhikrTranslation');

      const historyModal = $('historyModal');
      const historyList = $('historyList');
      const closeHistoryBtn = $('closeHistoryBtn');
      const closeHistoryBtn2 = $('closeHistoryBtn2');
      const clearHistoryBtn = $('clearHistoryBtn');

      const dhikrModal = $('dhikrModal');
      const dhikrModalTitle = $('dhikrModalTitle');
      const dhikrNameInput = $('dhikrNameInput');
      const dhikrArabicInput = $('dhikrArabicInput');
      const dhikrTranslationInput = $('dhikrTranslationInput');
      const dhikrTargetInput = $('dhikrTargetInput');
      const closeDhikrBtn = $('closeDhikrBtn');
      const cancelDhikrBtn = $('cancelDhikrBtn');
      const saveDhikrBtn = $('saveDhikrBtn');

      let editingDhikrId = null;

      // ========== HELPERS ==========
      function getActive() {
        return dhikrs.find(d => d.id === activeId) || dhikrs[0];
      }

      function uid() {
        return 'dhikr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      }

      // clamp target to 1..999999
      function sanitizeTarget(raw) {
        let n = parseInt(raw, 10);
        if (isNaN(n) || n < 1) return 1;
        if (n > MAX_COUNT) return MAX_COUNT;
        return n;
      }

      // ========== STORAGE ==========
      function saveAll() {
        try {
          localStorage.setItem(KEYS.DHIKRS, JSON.stringify(dhikrs));
          localStorage.setItem(KEYS.ACTIVE, activeId);
          showSaveIndicator();
        } catch (e) {
          console.warn('Save failed:', e);
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(KEYS.HISTORY, JSON.stringify(history));
        } catch (e) {
          console.warn('History save failed:', e);
        }
      }

      function saveDebounced() {
        if (saveDebounced.timer) clearTimeout(saveDebounced.timer);
        saveDebounced.timer = setTimeout(saveAll, 400);
      }

      function loadAll() {
        try {
          const rawDhikrs = localStorage.getItem(KEYS.DHIKRS);
          const rawActive = localStorage.getItem(KEYS.ACTIVE);
          const rawHistory = localStorage.getItem(KEYS.HISTORY);

          if (rawDhikrs) {
            const parsed = JSON.parse(rawDhikrs);
            if (Array.isArray(parsed) && parsed.length > 0) {
              dhikrs = parsed.filter(d => d && d.id && typeof d.count === 'number');
              // ensure targets are within bounds after schema change
              dhikrs.forEach(d => {
                d.target = sanitizeTarget(d.target);
                if (d.count > MAX_COUNT) d.count = MAX_COUNT;
                if (d.count < 0) d.count = 0;
              });
            }
          }

          if (!dhikrs.length) {
            // migrate from v2 if present
            const v2 = localStorage.getItem('tasbeeh_dhikrs_v2');
            if (v2) {
              try {
                const parsed = JSON.parse(v2);
                if (Array.isArray(parsed) && parsed.length > 0) {
                  dhikrs = parsed.filter(d => d && d.id && typeof d.count === 'number');
                  dhikrs.forEach(d => { d.target = sanitizeTarget(d.target); });
                }
              } catch (e) {}
            }
            if (!dhikrs.length) {
              dhikrs = JSON.parse(JSON.stringify(DEFAULT_DHIKRS));
            }
          }

          if (rawActive && dhikrs.some(d => d.id === rawActive)) {
            activeId = rawActive;
          } else {
            activeId = dhikrs[0].id;
          }

          if (rawHistory) {
            const parsed = JSON.parse(rawHistory);
            if (Array.isArray(parsed)) {
              history = parsed.filter(h => h && typeof h.count === 'number' && typeof h.timestamp === 'number').slice(0, MAX_HISTORY);
            }
          }
        } catch (e) {
          console.warn('Load failed:', e);
          dhikrs = JSON.parse(JSON.stringify(DEFAULT_DHIKRS));
          activeId = dhikrs[0].id;
        }
      }

      // ========== SAVE INDICATOR ==========
      let saveTimeout = null;
      function showSaveIndicator() {
        saveIndicator.classList.add('show');
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => saveIndicator.classList.remove('show'), 1200);
      }

      // ========== UI RENDER ==========
      function updateUI() {
        const d = getActive();
        if (!d) return;

        countDisplay.textContent = d.count;
        targetInput.value = d.target;
        dhikrSelectedText.textContent = d.name;
        dhikrTranslation.textContent = d.translation || d.arabic || '';

        if (d.target > 0) {
          let percent = (d.count / d.target) * 100;
          if (percent > 100) percent = 100;
          progressFill.style.width = percent + '%';
        } else {
          progressFill.style.width = '0%';
        }

        if (d.count >= d.target && d.target > 0) {
          targetInput.style.background = '#3b8b4b';
          targetInput.style.color = '#fff9e6';
          targetInput.style.borderColor = '#dcf5c0';
        } else {
          targetInput.style.background = '#1f4f30';
          targetInput.style.color = '#dcf5c0';
          targetInput.style.borderColor = '#6fa87f';
        }
      }

      function renderDropdown() {
        dhikrDropdown.innerHTML = '';

        dhikrs.forEach(d => {
          const opt = document.createElement('div');
          opt.className = 'dhikr-option' + (d.id === activeId ? ' active' : '');
          opt.dataset.id = d.id;

          const info = document.createElement('div');
          info.className = 'dhikr-option-info';

          const nameEl = document.createElement('div');
          nameEl.className = 'dhikr-option-name';
          nameEl.textContent = d.name;
          info.appendChild(nameEl);

          if (d.arabic) {
            const ar = document.createElement('div');
            ar.className = 'dhikr-option-arabic';
            ar.textContent = d.arabic;
            info.appendChild(ar);
          }

          const stats = document.createElement('div');
          stats.className = 'dhikr-option-stats';

          const cEl = document.createElement('div');
          cEl.className = 'dhikr-option-count';
          cEl.textContent = d.count;
          stats.appendChild(cEl);

          const tEl = document.createElement('div');
          tEl.className = 'dhikr-option-target';
          tEl.textContent = '/ ' + d.target;
          stats.appendChild(tEl);

          const del = document.createElement('button');
          del.className = 'dhikr-option-delete';
          del.textContent = '🗑';
          del.title = 'Delete this dhikr';
          del.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteDhikr(d.id);
          });

          opt.appendChild(info);
          opt.appendChild(stats);
          if (dhikrs.length > 1) opt.appendChild(del);

          opt.addEventListener('click', () => {
            switchDhikr(d.id);
            closeDropdown();
          });

          opt.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            openEditDhikr(d.id);
          });

          dhikrDropdown.appendChild(opt);
        });

        const divider = document.createElement('div');
        divider.className = 'dhikr-divider';
        dhikrDropdown.appendChild(divider);

        const addBtn = document.createElement('div');
        addBtn.className = 'dhikr-add-btn';
        addBtn.innerHTML = '<span>➕</span> Add New Dhikr';
        addBtn.addEventListener('click', () => {
          openAddDhikr();
          closeDropdown();
        });
        dhikrDropdown.appendChild(addBtn);
      }

      // ========== DROPDOWN ==========
      function openDropdown() {
        dhikrSelectDisplay.classList.add('open');
        dhikrDropdown.classList.add('show');
        renderDropdown();
      }

      function closeDropdown() {
        dhikrSelectDisplay.classList.remove('open');
        dhikrDropdown.classList.remove('show');
      }

      function toggleDropdown() {
        if (dhikrDropdown.classList.contains('show')) closeDropdown();
        else openDropdown();
      }

      // ========== DHIKR ACTIONS ==========
      function switchDhikr(id) {
        if (id === activeId) return;
        activeId = id;
        updateUI();
        saveAll();
      }

      function deleteDhikr(id) {
        if (dhikrs.length <= 1) {
          alert('You need at least one dhikr.');
          return;
        }
        const d = dhikrs.find(x => x.id === id);
        if (!d) return;
        if (!confirm(`Delete "${d.name}" and its saved count (${d.count})?`)) return;

        dhikrs = dhikrs.filter(x => x.id !== id);
        if (activeId === id) activeId = dhikrs[0].id;
        saveAll();
        updateUI();
        renderDropdown();
      }

      function increment() {
        const d = getActive();
        if (!d) return;
        if (d.count < MAX_COUNT) d.count++;
        updateUI();
        pulseDisplay();
        saveDebounced();
        if (navigator.vibrate) navigator.vibrate(10);
      }

      function decrement() {
        const d = getActive();
        if (!d) return;
        if (d.count > 0) {
          d.count--;
          updateUI();
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 100);
          saveDebounced();
        } else {
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 100);
        }
      }

      function resetCounter() {
        const d = getActive();
        if (!d) return;
        if (d.count === 0) {
          countDisplay.classList.add('pulse');
          setTimeout(() => countDisplay.classList.remove('pulse'), 200);
          return;
        }
        addHistoryEntry(d);
        d.count = 0;
        updateUI();
        countDisplay.classList.add('pulse');
        setTimeout(() => countDisplay.classList.remove('pulse'), 200);
        saveAll();
        if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
      }

      function pulseDisplay() {
        countDisplay.classList.add('pulse');
        setTimeout(() => countDisplay.classList.remove('pulse'), 150);
      }

      function applyTargetFromInput() {
        const d = getActive();
        if (!d) return;
        d.target = sanitizeTarget(targetInput.value);
        targetInput.value = d.target;
        updateUI();
        saveAll();
      }

      // ========== HISTORY ==========
      function addHistoryEntry(dhikr) {
        if (!dhikr || dhikr.count <= 0) return;
        history.unshift({
          name: dhikr.name,
          count: dhikr.count,
          timestamp: Date.now()
        });
        if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
        saveHistory();
      }

      function renderHistory() {
        historyList.innerHTML = '';
        if (!history.length) {
          const e = document.createElement('div');
          e.className = 'empty-history';
          e.textContent = 'No saved sessions yet.';
          historyList.appendChild(e);
          return;
        }
        history.forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';

          const name = document.createElement('span');
          name.className = 'h-name';
          name.textContent = item.name;

          const countEl = document.createElement('span');
          countEl.className = 'h-count';
          countEl.textContent = item.count;

          const time = document.createElement('span');
          time.className = 'h-time';
          time.textContent = formatTime(item.timestamp);

          div.appendChild(name);
          div.appendChild(countEl);
          div.appendChild(time);
          historyList.appendChild(div);
        });
      }

      function formatTime(ts) {
        const d = new Date(ts);
        const now = new Date();
        if (d.toDateString() === now.toDateString()) {
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }

      function openHistory() {
        renderHistory();
        historyModal.classList.add('show');
      }
      function closeHistory() {
        historyModal.classList.remove('show');
      }
      function clearHistory() {
        if (!history.length) return;
        if (confirm('Clear all saved sessions?')) {
          history = [];
          saveHistory();
          renderHistory();
        }
      }

      // ========== ADD / EDIT DHIKR ==========
      function openAddDhikr() {
        editingDhikrId = null;
        dhikrModalTitle.textContent = '➕ Add New Dhikr';
        dhikrNameInput.value = '';
        dhikrArabicInput.value = '';
        dhikrTranslationInput.value = '';
        dhikrTargetInput.value = 33;
        dhikrModal.classList.add('show');
        setTimeout(() => dhikrNameInput.focus(), 100);
      }

      function openEditDhikr(id) {
        const d = dhikrs.find(x => x.id === id);
        if (!d) return;
        editingDhikrId = id;
        dhikrModalTitle.textContent = '✏️ Edit Dhikr';
        dhikrNameInput.value = d.name;
        dhikrArabicInput.value = d.arabic || '';
        dhikrTranslationInput.value = d.translation || '';
        dhikrTargetInput.value = d.target;
        dhikrModal.classList.add('show');
      }

      function closeDhikrModal() {
        dhikrModal.classList.remove('show');
        editingDhikrId = null;
      }

      function saveDhikrFromModal() {
        const name = dhikrNameInput.value.trim();
        if (!name) {
          alert('Please enter a name for the dhikr.');
          dhikrNameInput.focus();
          return;
        }
        const arabic = dhikrArabicInput.value.trim();
        const translation = dhikrTranslationInput.value.trim();
        const targetVal = sanitizeTarget(dhikrTargetInput.value);

        if (editingDhikrId) {
          const d = dhikrs.find(x => x.id === editingDhikrId);
          if (d) {
            d.name = name;
            d.arabic = arabic;
            d.translation = translation;
            d.target = targetVal;
          }
        } else {
          const newDhikr = {
            id: uid(),
            name,
            arabic,
            translation,
            count: 0,
            target: targetVal
          };
          dhikrs.push(newDhikr);
          activeId = newDhikr.id;
        }

        saveAll();
        updateUI();
        closeDhikrModal();
      }

      // ========== EVENT LISTENERS ==========
      incrementBtn.addEventListener('click', increment);
      decrementBtn.addEventListener('click', decrement);
      resetBtn.addEventListener('click', resetCounter);
      countDisplay.addEventListener('click', increment);

      saveSessionBtn.addEventListener('click', () => {
        const d = getActive();
        if (!d || d.count <= 0) {
          alert('Nothing to save yet.');
          return;
        }
        addHistoryEntry(d);
        showSaveIndicator();
        if (navigator.vibrate) navigator.vibrate(15);
      });

      // Dhikr dropdown
      dhikrSelectDisplay.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDropdown();
      });

      document.addEventListener('click', (e) => {
        if (!dhikrSelectDisplay.contains(e.target) && !dhikrDropdown.contains(e.target)) {
          closeDropdown();
        }
      });

      // Target input — allow up to 6 digits
      targetInput.addEventListener('input', () => {
        const d = getActive();
        if (!d) return;

        // Allow typing freely but strip non-digits, enforce max 6 chars
        let raw = targetInput.value.replace(/\D/g, '');
        if (raw.length > 6) raw = raw.slice(0, 6);
        // If empty during typing, let it be empty so user can retype
        if (raw === '') {
          targetInput.value = '';
          return;
        }
        // Do not overwrite while typing unless >6 digits
        if (raw !== targetInput.value) {
          targetInput.value = raw;
        }

        const parsed = parseInt(raw, 10);
        if (!isNaN(parsed) && parsed >= 1) {
          d.target = Math.min(parsed, MAX_COUNT);
          updateUI();
          saveDebounced();
        }
      });

      targetInput.addEventListener('blur', applyTargetFromInput);
      targetInput.addEventListener('change', applyTargetFromInput);
      targetInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          targetInput.blur();
          applyTargetFromInput();
        }
        e.stopPropagation();
      });

      // History
      historyBtn.addEventListener('click', openHistory);
      closeHistoryBtn.addEventListener('click', closeHistory);
      closeHistoryBtn2.addEventListener('click', closeHistory);
      clearHistoryBtn.addEventListener('click', clearHistory);
      historyModal.addEventListener('click', (e) => {
        if (e.target === historyModal) closeHistory();
      });

      // Dhikr modal
      closeDhikrBtn.addEventListener('click', closeDhikrModal);
      cancelDhikrBtn.addEventListener('click', closeDhikrModal);
      saveDhikrBtn.addEventListener('click', saveDhikrFromModal);
      dhikrModal.addEventListener('click', (e) => {
        if (e.target === dhikrModal) closeDhikrModal();
      });

      // Keyboard
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === targetInput) return;
        if (document.activeElement === dhikrNameInput ||
            document.activeElement === dhikrArabicInput ||
            document.activeElement === dhikrTranslationInput ||
            document.activeElement === dhikrTargetInput) return;

        if (historyModal.classList.contains('show')) {
          if (e.key === 'Escape') closeHistory();
          return;
        }
        if (dhikrModal.classList.contains('show')) {
          if (e.key === 'Escape') closeDhikrModal();
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveDhikrFromModal();
          return;
        }

        if (e.key === ' ' || e.key === 'Space' || e.key === '+' || e.key === 'ArrowUp' || e.key === 'Enter') {
          e.preventDefault();
          increment();
        } else if (e.key === '-' || e.key === 'ArrowDown') {
          e.preventDefault();
          decrement();
        } else if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetCounter();
        } else if (e.key === 'h' || e.key === 'H') {
          e.preventDefault();
          openHistory();
        } else if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          saveSessionBtn.click();
        } else if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          openAddDhikr();
        } else if (e.key === 'Escape') {
          closeDropdown();
        }
      });

      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

      // Save on exit
      window.addEventListener('beforeunload', saveAll);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) saveAll();
      });

      // ========== INIT ==========
      loadAll();
      updateUI();
      renderDropdown();

    })();
  </script>
</body>
</html>
